# Fælles SSL-indstillinger for alle subdomæner.
# Certbot genererer /etc/letsencrypt/options-ssl-nginx.conf automatisk
# ved første kørsel — denne fil er bare en placeholder for at dokumentere
# at vi stoler på certbot's default ciphers.

include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# Sikkerhedsheaders — gælder alle proxyed apps
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
