# Delt auth_request-snippet for subdomæner beskyttet af Bon v2's login.
# Inkluderes på whiteboard.ristetrug.dk, sop.ristetrug.dk, grocy-*.ristetrug.dk
#
# Flow:
#   Browser → Nginx på dette subdomæne
#            → auth_request /bon-auth → 127.0.0.1:4321/api/auth/me (Bon v2)
#              200 OK  → proxy_pass videre til appen
#              401     → redirect til bon.ristetrug.dk/login?next=<oprindelig URL>
#
# Forudsætning: Bon v2's session-cookie har Domain=.ristetrug.dk
# (se server.js + COOKIE_DOMAIN i .env).
#
# ⚠ Gaten er kun rigtig for BROWSERE.
#
# En maskine — webhook, cron, integration — har ingen session. Den får 302,
# fetch() følger den, POST bliver til GET, og kaldet lander på login-siden
# der svarer 200. Afsenderen ser en succes; modtageren så aldrig kaldet.
# Præcis dét skjulte sytten varemodtagelser fra FVST-loggen (#412/#460).
#
# Skal et subdomæne tage imod server-til-server-kald, så giv DEN sti sin
# egen `location` med `auth_request off` — og en anden dør i stedet (delt
# hemmelighed i en header, tjekket af appen). Aldrig `auth_request off`
# uden noget i stedet: bag gaten er apperne her uautentificerede.
# Eksempel: /api/events/webhook i whiteboard.ristetrug.dk.full.conf.

auth_request /bon-auth;
auth_request_set $auth_status $upstream_status;
error_page 401 = @bon_login_redirect;

location = /bon-auth {
    internal;
    proxy_pass http://127.0.0.1:4321/api/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host bon.ristetrug.dk;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Host $host;

    # Short-circuit — vi vil ikke blokere siden hvis Bon v2 er langsom
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location @bon_login_redirect {
    return 302 https://bon.ristetrug.dk/login.html?next=$scheme://$host$request_uri;
}

# Let's Encrypt ACME-validering må ALDRIG kræve login
location /.well-known/acme-challenge/ {
    auth_request off;
    root /var/www/html;
    try_files $uri =404;
}
