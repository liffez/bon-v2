# Whiteboard — Node.js på localhost:3847. Beskyttet af Bon v2's login.
#
# FULL-CONFIG: bruges EFTER:
#   1. DNS for whiteboard.ristetrug.dk peger på Hetzner
#   2. Let's Encrypt-cert er hentet via:
#      sudo certbot certonly --webroot -w /var/www/html -d whiteboard.ristetrug.dk
#
# Installation:
#   sudo cp .../whiteboard.ristetrug.dk.full.conf \
#           /etc/nginx/sites-available/whiteboard.ristetrug.dk.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ── Port 80 — ACME-fornyelse + redirect til HTTPS ─────────────────
server {
    listen 80;
    server_name whiteboard.ristetrug.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443 — TLS + Bon-auth + proxy til Whiteboard ──────────────
server {
    listen 443 ssl http2;
    server_name whiteboard.ristetrug.dk;

    ssl_certificate     /etc/letsencrypt/live/whiteboard.ristetrug.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whiteboard.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/bon-auth.conf;

    client_max_body_size 10m;

    # ── Maskine-kald: varemodtagelse fra Bon v2 ────────────────────
    #
    # Login-gaten ovenfor svarer 302 → bon.ristetrug.dk/login.html. Det er
    # rigtigt for en browser og forkert for en maskine: en webhook har ingen
    # session, fetch() følger omdirigeringen, laver POST om til GET og lander
    # på vores egen login-side — der svarer 200. Sytten varemodtagelser stod
    # som "sendt" mens FVST-loggen havde én.
    #
    # Derfor har webhooken sin egen sti uden gaten. Den er IKKE ubeskyttet:
    # Whiteboard kræver headeren X-Webhook-Secret på netop denne rute og
    # afviser med 401 uden den (server/routes/events.js). Hemmeligheden
    # deles via GOODS_RECEIPT_WEBHOOK_SECRET i begge .env-filer.
    #
    # Hvorfor en egen sti frem for at åbne /api/events: nginx matcher på sti,
    # ikke på metode, så en undtagelse dér ville også åbne GET /api/events —
    # hele FVST-loggen — for internettet. (`auth_request` kan ikke stå i en
    # limit_except-blok; direktivet har ikke NGX_HTTP_LMT_CONF.) Og lå begge
    # slags kald på samme sti, kunne appen ikke skelne tavlens egen formular
    # — der har en session, men ingen hemmelighed — fra webhooken.
    location = /api/events/webhook {
        auth_request off;

        # Appens egen 401 skal nå afsenderen som et 401.
        # `error_page 401 = @bon_login_redirect` arves fra bon-auth-snippet'et
        # ovenfor, og et redirect er præcis det svar der lod sytten
        # varemodtagelser se ud som sendt. Standardværdien er allerede `off`,
        # men den står her fordi konsekvensen af at den ikke gør er usynlig.
        proxy_intercept_errors off;

        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Maskine-kald: Bon v2 henter skemaet ────────────────────────
    #
    # Samme dør, modsat retning. Bon v2's varemodtagelse havde FVST-skemaet
    # skrevet af i hånden — grænseværdier og labels kopieret ind i JavaScript
    # — så en rettelse i tavlens admin aldrig nåede derover. Nu henter den
    # skemaet herfra, og tavlen er eneste kilde.
    #
    # Egen sti frem for at åbne /api/registration-types: nginx matcher på sti,
    # ikke på metode, så en undtagelse på listen ville også åbne POST og PATCH
    # — hele CRUD-fladen på skemaerne — for internettet.
    #
    # Query-strengen (?key=varemodtagelse) indgår ikke i `location =`-match,
    # så denne ene sti dækker alle skemaer. Adgangen er den samme uanset key:
    # hemmeligheden, som Whiteboard kræver på ruten
    # (server/routes/registration-types.js → server/helpers/machineAuth.js).
    location = /api/registration-types/schema {
        auth_request off;
        proxy_intercept_errors off;   # appens 401 skal nå frem som 401, ikke som et login-redirect

        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
    }
}
