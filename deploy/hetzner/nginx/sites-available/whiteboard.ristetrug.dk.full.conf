# Whiteboard — Node.js på localhost:3847. Beskyttet af Bon v2's login.
#
# FULL-CONFIG: bruges EFTER:
#   1. DNS for whiteboard.ristetrug.dk peger på Hetzner
#   2. Let's Encrypt-cert er hentet via:
#      sudo certbot certonly --webroot -w /var/www/html -d whiteboard.ristetrug.dk
#
# Installation:
#   sudo cp .../whiteboard.ristetrug.dk.full.conf \
#           /etc/nginx/sites-available/whiteboard.ristetrug.dk.conf
#   sudo nginx -t && sudo systemctl reload nginx

# ── Port 80 — ACME-fornyelse + redirect til HTTPS ─────────────────
server {
    listen 80;
    server_name whiteboard.ristetrug.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443 — TLS + Bon-auth + proxy til Whiteboard ──────────────
server {
    listen 443 ssl http2;
    server_name whiteboard.ristetrug.dk;

    ssl_certificate     /etc/letsencrypt/live/whiteboard.ristetrug.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whiteboard.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/bon-auth.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
    }
}
