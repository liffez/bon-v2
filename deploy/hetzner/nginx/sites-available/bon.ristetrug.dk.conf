# Bon v2 — hoved-vhost
# Node.js-app på localhost:4321. SSE kræver deaktivering af buffering.

server {
    listen 80;
    server_name bon.ristetrug.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bon.ristetrug.dk;

    # SSL-certifikater genereres af certbot:
    # ssl_certificate /etc/letsencrypt/live/bon.ristetrug.dk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bon.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    client_max_body_size 25m;  # mail-vedhæftninger op til 10 MB + margin

    # Upload-stier serveres direkte af appen (attachments, receipts)
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE — disabler buffering + lang read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection "";
    }
}
