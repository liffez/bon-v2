# SOP — Node.js på localhost:3005. Beskyttet af Bon v2's login.
#
# BOOTSTRAP-VERSION: HTTP-only indtil DNS skifter til Hetzner og cert hentes.
# Efter DNS-switch + cert: kommentér HTTP-blokken nedenfor ud og uncomment HTTPS.

server {
    listen 80;
    server_name sop.ristetrug.dk;

    # ACME-validering (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 503 "sop.ristetrug.dk: cert mangler — DNS er muligvis stadig på Linode\n";
        add_header Content-Type text/plain;
    }
}

