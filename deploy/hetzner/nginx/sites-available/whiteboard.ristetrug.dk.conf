# Whiteboard — Node.js på localhost:3847. Beskyttet af Bon v2's login.

server {
    listen 80;
    server_name whiteboard.ristetrug.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name whiteboard.ristetrug.dk;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/bon-auth.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets / SSE hvis Whiteboard bruger det
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 24h;
    }
}
