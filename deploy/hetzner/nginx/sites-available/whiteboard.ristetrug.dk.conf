# Whiteboard — Node.js på localhost:3847. Beskyttet af Bon v2's login.
#
# BOOTSTRAP-VERSION: HTTP-only indtil DNS skifter til Hetzner og cert hentes.
# Efter DNS-switch + cert: kommentér HTTP-blokken nedenfor ud og uncomment HTTPS.

server {
    listen 80;
    server_name whiteboard.ristetrug.dk;

    # ACME-validering (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Indtil cert er hentet: vis simpel besked i stedet for at redirecte til HTTPS
    location / {
        return 503 "whiteboard.ristetrug.dk: cert mangler — DNS er muligvis stadig på Linode\n";
        add_header Content-Type text/plain;
    }

    # EFTER cert er hentet: erstat 503-blokken ovenfor med:
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

