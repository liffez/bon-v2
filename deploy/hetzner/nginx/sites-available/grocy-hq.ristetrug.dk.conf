# Grocy HQ — PHP-FPM pool grocy-hq. Beskyttet af Bon v2's login.

server {
    listen 80;
    server_name grocy-hq.ristetrug.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name grocy-hq.ristetrug.dk;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/bon-auth.conf;

    root /home/leif/grocy/hq/public;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/grocy-hq.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }
}
