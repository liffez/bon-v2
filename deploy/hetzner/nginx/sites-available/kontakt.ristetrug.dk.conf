# kontakt.ristetrug.dk — kundevendt booking.
#
# Domænet bærer de sider kunder ser: smagsprøve-bookingen, kontaktformularen
# og de korte token-links fra mails. Ikke resten af appen.
#
# Grunden er den samme som i #581: en dør man ikke har tænkt over, står
# åben. Session-cookien har Domain=.ristetrug.dk og følger med herind — en
# bred `location / { proxy_pass ...; }` ville gøre dette kundedomæne til
# endnu en indgang til office, settings og hele /api for enhver der er
# logget ind. Listen nedenfor spejler PUBLIC_API_PATHS i server.js.
#
# Modstykket i appen er indstillingen booking_customer_url_base (#169).
# Den skal pege på dette domæne; booking_public_url_base bliver på
# bon.ristetrug.dk, fordi den bygger office-links i interne mails.
#
# Certifikatet er hentet med webroot, så certbot ikke skriver i denne fil:
#   sudo certbot certonly --webroot -w /var/www/html -d kontakt.ristetrug.dk

server {
    listen 80;
    server_name kontakt.ristetrug.dk;

    # ACME-validering må ALDRIG kræve login eller redirect. Blokken bliver
    # stående efter første udstedelse — `certbot renew` går samme vej, og
    # fjerner man den, opdager man det først 60 dage senere.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kontakt.ristetrug.dk;

    ssl_certificate     /etc/letsencrypt/live/kontakt.ristetrug.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kontakt.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    # Sat én gang på server-niveau og arvet af alle location-blokke.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─── Sider ──────────────────────────────────────────────────────────
    # Domænet hedder kontakt, så bar rod er kontaktformularen.
    location = / {
        proxy_pass http://127.0.0.1:4321/book/kontakt;
    }
    location = /book/kontakt {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /book/smagning {
        proxy_pass http://127.0.0.1:4321;
    }

    # Korte token-links fra mails ({{booking_link}}). Appen svarer 302 til
    # /book/<flow> med en relativ sti, så kunden bliver på dette domæne.
    # Mønstret er det samme som routes/booking-redirect.js validerer.
    # Regex'en er i anførselstegn: nginx læser ellers { og } i {8,64} som
    # blok-tegn og fejler med `unknown directive "8,64}$"`.
    location ~ "^/b/[A-Fa-f0-9]{8,64}$" {
        proxy_pass http://127.0.0.1:4321;
    }

    # ─── Statisk ────────────────────────────────────────────────────────
    location = /assets/logo.svg {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:4321;
    }

    # ─── De offentlige booking-endpoints — og kun dem ───────────────────
    # Admin-ruterne under /api/booking kommer bevidst IKKE med.
    location = /api/booking/meeting-types {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /api/booking/contact-reasons {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /api/booking/slots {
        proxy_pass http://127.0.0.1:4321;
    }
    location ~ ^/api/booking/page-templates/[^/]+$ {
        proxy_pass http://127.0.0.1:4321;
    }
    location ~ ^/api/booking/token/[^/]+$ {
        proxy_pass http://127.0.0.1:4321;
    }

    # ─── Indsendelse ────────────────────────────────────────────────────
    # Same-origin, så CORS-middlewaren i server.js er ikke involveret.
    location = /webhook/booking-smagning {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /webhook/booking-kontakt {
        proxy_pass http://127.0.0.1:4321;
    }

    # ─── Afvisning ──────────────────────────────────────────────────────
    # Maskin-stier og ukendte sider under de kendte præfikser afvises
    # ligeud. En redirect til forsiden ville give en fetch() HTML tilbage
    # hvor den ventede JSON — en forvirrende fejl i stedet for en klar.
    # Præfikserne taber til de eksakte og regex-baserede locations ovenfor,
    # så de rammer kun det uventede.
    location /api/     { return 404; }
    location /webhook/ { return 404; }
    location /assets/  { return 404; }
    location /book/    { return 404; }
    location /b/       { return 404; }

    # Alt andet er et menneske med et forkert eller forældet link — typisk
    # en browser der autocompleter til en sti fra historikken. Send dem til
    # kontaktformularen frem for nginx' rå fejlside.
    location / {
        return 301 https://$host/;
    }
}
