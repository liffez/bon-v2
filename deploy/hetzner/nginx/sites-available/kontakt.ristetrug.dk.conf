# kontakt.ristetrug.dk — kundevendt kontaktformular.
#
# Domænet er ét pænt navn til én side: Bon v2's /book/kontakt. Derfor
# proxier denne vhost ikke appen bredt, men kun de fem stier siden faktisk
# bruger. Alt andet svarer 404.
#
# Grunden er den samme som i #581: en dør man ikke har tænkt over, står
# åben. Session-cookien har Domain=.ristetrug.dk og følger med herind — en
# bred `location / { proxy_pass ...; }` ville gøre dette kundedomæne til
# endnu en indgang til office, settings og hele /api for enhver der er
# logget ind. Listen nedenfor spejler PUBLIC_API_PATHS i server.js.
#
# BOOTSTRAP-VERSION: HTTP-only indtil certifikatet er hentet:
#
#   sudo certbot certonly --webroot -w /var/www/html -d kontakt.ristetrug.dk
#
# Derefter: erstat 503-blokken med redirect'et, og uncomment HTTPS-blokken.

server {
    listen 80;
    server_name kontakt.ristetrug.dk;

    # ACME-validering må ALDRIG kræve login eller redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Før cert: sig det ligeud i stedet for at sende folk videre til en
    # https-side der ikke kan indlæses.
    # EFTER cert: erstat de to linjer med
    #     return 301 https://$host$request_uri;
    location / {
        return 503 "kontakt.ristetrug.dk: certifikat mangler endnu\n";
        add_header Content-Type text/plain;
    }
}

