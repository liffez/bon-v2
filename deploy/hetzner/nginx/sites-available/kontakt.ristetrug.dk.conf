# kontakt.ristetrug.dk — kundevendt kontaktformular.
#
# Domænet er ét pænt navn til én side: Bon v2's /book/kontakt. Derfor
# proxier denne vhost ikke appen bredt, men kun de stier siden faktisk
# bruger.
#
# Grunden er den samme som i #581: en dør man ikke har tænkt over, står
# åben. Session-cookien har Domain=.ristetrug.dk og følger med herind — en
# bred `location / { proxy_pass ...; }` ville gøre dette kundedomæne til
# endnu en indgang til office, settings og hele /api for enhver der er
# logget ind. Listen nedenfor spejler PUBLIC_API_PATHS i server.js.
#
# Certifikatet er hentet med webroot, så certbot ikke skriver i denne fil:
#   sudo certbot certonly --webroot -w /var/www/html -d kontakt.ristetrug.dk

server {
    listen 80;
    server_name kontakt.ristetrug.dk;

    # ACME-validering må ALDRIG kræve login eller redirect. Blokken bliver
    # stående efter første udstedelse — `certbot renew` går samme vej, og
    # fjerner man den, opdager man det først 60 dage senere.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kontakt.ristetrug.dk;

    ssl_certificate     /etc/letsencrypt/live/kontakt.ristetrug.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kontakt.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    # Sat én gang på server-niveau og arvet af alle location-blokke.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Selve formularen. Kunden ser kontakt.ristetrug.dk/ — appen ser
    # /book/kontakt. Query-strengen (?t=TOKEN til personlige links)
    # følger automatisk med.
    location = / {
        proxy_pass http://127.0.0.1:4321/book/kontakt;
    }

    # Logo på siden og ikon i browserfanen.
    location = /assets/logo.svg {
        proxy_pass http://127.0.0.1:4321;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:4321;
    }

    # De offentlige booking-endpoints siden kalder — og kun dem.
    # Admin-ruterne under /api/booking kommer bevidst IKKE med.
    location = /api/booking/contact-reasons {
        proxy_pass http://127.0.0.1:4321;
    }
    location ~ ^/api/booking/page-templates/[^/]+$ {
        proxy_pass http://127.0.0.1:4321;
    }
    location ~ ^/api/booking/token/[^/]+$ {
        proxy_pass http://127.0.0.1:4321;
    }

    # Indsendelse af formularen. Same-origin, så CORS-middlewaren i
    # server.js er ikke involveret.
    location = /webhook/booking-kontakt {
        proxy_pass http://127.0.0.1:4321;
    }

    # Ukendte maskin-stier afvises ligeud. En redirect til forsiden ville
    # give en fetch() HTML tilbage hvor den ventede JSON — en forvirrende
    # fejl i stedet for en klar. De tre præfikser taber til de eksakte og
    # regex-baserede locations ovenfor, så de rammer kun det uventede.
    location /api/     { return 404; }
    location /webhook/ { return 404; }
    location /assets/  { return 404; }

    # Alt andet er et menneske med et forkert eller forældet link — typisk
    # en browser der autocompleter til en sti fra historikken. Send dem til
    # formularen frem for nginx' rå fejlside.
    location / {
        return 301 https://$host/;
    }
}
