# Grocy Kælder — PHP-FPM pool grocy-kaelder. INGEN auth_request (egen login).

server {
    listen 80;
    server_name kaelder.ristetrug.dk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kaelder.ristetrug.dk;

    ssl_certificate /etc/letsencrypt/live/kaelder.ristetrug.dk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaelder.ristetrug.dk/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    root /home/leif/grocy/kaelder/public;
    index index.php;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/grocy-kaelder.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }
}
