[grocy-kaelder]
user = www-data
group = www-data
listen = /run/php/grocy-kaelder.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 3
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2

php_admin_value[error_log] = /var/log/php-fpm/grocy-kaelder-error.log
php_admin_flag[log_errors] = on
php_value[session.save_path] = /var/lib/php/sessions
