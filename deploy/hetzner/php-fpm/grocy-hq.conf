[grocy-hq]
user = www-data
group = www-data
listen = /run/php/grocy-hq.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 3

php_admin_value[error_log] = /var/log/php-fpm/grocy-hq-error.log
php_admin_flag[log_errors] = on
php_value[session.save_path] = /var/lib/php/sessions

; Lagerjournalen (/api/objects/stock_log) er ~75.000 rækker. Uden `limit` læser
; Grocy hele tabellen ind før den svarer, og PHP's standard på 128M løber tør
; → HTTP 500 på 0,4 s. Målt: 30.000 rækker går, 32.000 fejler, uanset offset
; (~4 KB pr. række → 75.000 rækker ≈ 320 MB + JSON). Kun HQ har en log i den
; størrelse. Med pm.max_children = 5 er worst case 5 × 512M — tjek `free -m`.
; Kun denne pool: de andre instanser og resten af serveren er urørte.
php_admin_value[memory_limit] = 512M
