<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planlægning — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/planning.css">
    <link rel="stylesheet" href="/shared/modal.css">
    <link rel="stylesheet" href="/shared/vare_picker.css">
    <link rel="stylesheet" href="/shared/help-system.css">
    <style>
        /* ═══ RESET + BASE ═══ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        #planningContainer {
            padding: 20px 24px;
        }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-planning" data-help-page-name="Køkken — Planlægning">

<!-- PLANLÆGNING RENDERES HER -->
<div id="planningContainer"></div>

<!-- SCRIPTS (rækkefølge er vigtig) -->
<script src="/BonConfig.js"></script>
<script src="/BonConfigBar.js"></script>
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/moms.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/modal.js"></script>
<script src="/shared/vare_picker.js"></script>
<script src="/shared/planning.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        initPlanning(document.getElementById('planningContainer'), {
            zone: 'kitchen',
        });
    });
</script>
<script src="/shared/help-system.js"></script>
</body>
</html>
