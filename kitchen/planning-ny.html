<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planlægning (ny) — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/periodPicker.css?v=2026-09-24">
    <link rel="stylesheet" href="/shared/planning_drill.css?v=2026-09-25">
    <link rel="stylesheet" href="/shared/vare_picker.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; background: var(--color-background); color: var(--color-text); min-height: 100vh; }
        #planningContainer { padding: 16px 20px; }
        .pd-oldlink { display: block; padding: 8px 20px 0; font-size: 13px; color: var(--color-text-dim); }
        .pd-oldlink a { color: var(--brand-primary); }
    </style>
</head>
<body class="zone-kitchen">

<div class="pd-oldlink">Ny planlægning — under afprøvning. <a href="/kitchen/planning.html">Gå til den gamle planlægning</a></div>
<div id="planningContainer"></div>

<script src="/BonConfig.js"></script>
<script src="/BonConfigBar.js"></script>
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/moms.js"></script>
<script src="/shared/api.js?v=2026-09-24"></script>
<script src="/shared/vare_picker.js"></script>
<script src="/shared/periodPicker.js?v=2026-09-24"></script>
<script src="/shared/planning_drill.js?v=2026-09-25"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });
        initPlanningDrill(document.getElementById('planningContainer'), { zone: 'kitchen' });
    });
</script>
</body>
</html>
