<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opskrifter — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/recipe_viewer.css">
    <link rel="stylesheet" href="/shared/recipe_designer.css">
    <link rel="stylesheet" href="/shared/recipe_editor.css">
    <!-- Designerens "Opret ny vare" monterer shared/product_create.js (#683) -->
    <link rel="stylesheet" href="/shared/product_create.css">
    <link rel="stylesheet" href="/shared/production_batch.css">
    <link rel="stylesheet" href="/shared/help-system.css">
    <style>
        /* RESET + BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* TAB BAR */
        .tab-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px;
            display: flex; gap: 0;
        }
        .tab-bar a {
            padding: 12px 20px;
            font-size: 14px; font-weight: 700;
            color: var(--color-text-dim);
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
        }
        .tab-bar a:hover { color: var(--color-text); }
        .tab-bar a.active {
            color: var(--brand-primary);
            border-bottom-color: var(--brand-primary);
        }

        /* CONTENT */
        #recipeViewerContainer {
            padding: 20px 24px;
            max-width: 900px;
        }
        #recipeDesignerContainer {
            padding: 0;
            max-width: 900px;
            display: none;
        }
        /* Editoren har to kolonner — liste og overblik. 900 px var den gamle
           designers mål (én kolonne), og klemte navne-kolonnen ned på 156 px,
           så badget måtte bryde om på hvert halvfabrikat. 1280 er samme
           læsbarhedsgrænse som dashboardets `.content`. */
        #recipeDesignerContainer.re-mounted { max-width: 1280px; }
        .tab-bar a { cursor: pointer; }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-recipes" data-help-page-name="Køkken — Opskrifter">

<!-- TAB BAR -->
<div class="tab-bar">
    <a href="#" id="tabViewer" class="active">Opskrifter</a>
    <a href="#" id="tabDesigner">Designer</a>
</div>

<!-- RECIPE VIEWER RENDERES HER -->
<div id="recipeViewerContainer"></div>
<div id="recipeDesignerContainer"></div>

<!-- SCRIPTS -->
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/grocy_num.js"></script>
<script src="/shared/moms.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/recipe_yield.js"></script>
<script src="/shared/production_batch.js"></script>
<script src="/shared/recipe_viewer.js"></script>
<script src="/shared/product_create.js"></script>
<!-- Editoren: linjemodel og trin-serialisering skal loades FØR den -->
<script src="/shared/recipe_lines.js"></script>
<script src="/shared/recipe_steps.js"></script>
<script src="/shared/recipe_diff.js"></script>
<script src="/shared/recipe_editor.js"></script>
<script src="/shared/recipe_designer.js"></script>
<script>
    var _designerInitialized = false;

    document.addEventListener('DOMContentLoaded', async function() {
        var currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        var viewerContainer = document.getElementById('recipeViewerContainer');
        var designerContainer = document.getElementById('recipeDesignerContainer');
        var tabViewer = document.getElementById('tabViewer');
        var tabDesigner = document.getElementById('tabDesigner');

        // Init viewer by default
        initRecipeViewer(viewerContainer);

        // Check URL hash for initial tab
        if (window.location.hash === '#designer') {
            switchToDesigner();
        }

        tabViewer.addEventListener('click', function(e) {
            e.preventDefault();
            tabViewer.classList.add('active');
            tabDesigner.classList.remove('active');
            viewerContainer.style.display = 'block';
            designerContainer.style.display = 'none';
            window.location.hash = '';
        });

        tabDesigner.addEventListener('click', function(e) {
            e.preventDefault();
            switchToDesigner();
        });

        function switchToDesigner() {
            tabDesigner.classList.add('active');
            tabViewer.classList.remove('active');
            viewerContainer.style.display = 'none';
            designerContainer.style.display = 'block';
            window.location.hash = 'designer';
            if (!_designerInitialized) {
                initRecipeDesigner(designerContainer);
                _designerInitialized = true;
            }
        }
    });

</script>
<script src="/shared/help-system.js"></script>
</body>
</html>
