<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Køkken I Dag — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/bon_kort.css">
    <link rel="stylesheet" href="/shared/modal.css">
    <style>
        /* ═══ RESET + BASE ═══ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* ═══ TOPBAR ═══ */
        .topbar {
            background: var(--brand-primary); color: white;
            padding: 0 24px; height: 44px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 300;
        }
        .topbar-left  { display: flex; align-items: center; gap: 4px; }
        .topbar-logo  { font-size: 15px; font-weight: 700; margin-right: 16px; }
        .topbar-nav a {
            color: rgba(255,255,255,0.65); text-decoration: none;
            font-size: 13px; font-weight: 700; padding: 0 12px;
            height: 44px; display: inline-flex; align-items: center;
            border-bottom: 3px solid transparent; transition: all 0.15s;
        }
        .topbar-nav a:hover  { color: white; }
        .topbar-nav a.active { color: white; border-bottom-color: rgba(255,255,255,0.55); }
        .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .live-dot { display: flex; align-items: center; gap: 5px; opacity: 0.8; }
        .live-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #7cdb5e; display: block; }
        .kiosk-btn {
            padding: 7px 14px; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 6px;
            background: transparent; font-family: 'Lato', sans-serif; font-size: 13px;
            font-weight: 700; color: white; cursor: pointer;
        }

        /* ═══ TODAY HEADER ═══ */
        .today-header {
            background: white; border-bottom: 1px solid var(--color-border);
            padding: 10px 24px; position: sticky; top: 44px; z-index: 200;
            display: flex; align-items: center; gap: 16px;
        }
        .today-title { font-size: 18px; font-weight: 700; }
        .today-count { font-size: 13px; color: var(--color-text-dim); }
        .view-filters { margin-left: auto; display: flex; gap: 8px; align-items: center; }

        /* ═══ FILTER BUTTONS ═══ */
        .filter-btn {
            padding: 7px 16px; border: 1.5px solid var(--color-border); border-radius: 6px;
            background: white; font-family: 'Lato', sans-serif; font-size: 13px;
            font-weight: 700; color: var(--color-text-dim); cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            user-select: none; -webkit-user-select: none;
            position: relative; overflow: hidden;
        }
        .filter-btn .peek-bar {
            position: absolute; bottom: 0; left: 0; height: 3px;
            background: rgba(255,255,255,0.6); width: 0;
            pointer-events: none;
        }
        .filter-btn.peek .peek-bar { animation: peekProgress 8s linear forwards; }
        @keyframes peekProgress { from { width: 100%; } to { width: 0%; } }

        .filter-btn:hover:not([class*="on-"]):not([class*="peek-"]) {
            border-color: var(--brand-primary); color: var(--brand-primary);
        }
        .filter-btn.on-igang,   .filter-btn.peek-igang { background: #d4781a; color: white; border-color: #d4781a; }
        .filter-btn.on-klar,    .filter-btn.peek-klar  { background: #2e8b2e; color: white; border-color: #2e8b2e; }
        .filter-btn.on-lev,     .filter-btn.peek-lev   { background: #8a8580; color: white; border-color: #8a8580; }
        .filter-btn.locked::after { content: ' 🔒'; font-size: 11px; }
        .lev-count { font-weight: 400; opacity: 0.85; }
        .lev-count:empty { display: none; }

        /* ═══ FILTER BODY STATES ═══ */
        body.filter-igang .bon-card:not([data-status="igang"]) { display: none !important; }
        body.filter-klar  .bon-card:not([data-status="klar"])  { display: none !important; }
        body:not(.show-lev) .bon-card[data-status="lev"]:not(.leveret-fading) { display: none !important; }
        body.show-lev .bon-card:not([data-status="lev"]) { display: none !important; }

        /* ═══ LAYOUT ═══ */
        .view-content { padding: 20px 24px; }
        .cards-grid   { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    </style>
</head>
<body class="zone-kitchen">

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">Ristet Rug</span>
        <nav class="topbar-nav">
            <a href="/kitchen/today.html" class="active">I DAG</a>
            <a href="/kitchen/later.html">SENERE</a>
            <a href="/kitchen/planning.html">PLANLÆGNING</a>
            <a href="/kitchen/orders.html">MERE ▾</a>
        </nav>
    </div>
    <div class="topbar-right">
        <span class="live-dot">Live</span>
        <button class="kiosk-btn">KIOSK</button>
    </div>
</header>

<!-- TODAY HEADER -->
<header class="today-header">
    <div class="today-title" id="todayTitle">I dag</div>
    <span class="today-count" id="todayCount">0 bons</span>
    <div class="view-filters">
        <button class="filter-btn" id="btnLev"
            onmousedown="holdStart('lev')" onmouseup="holdEnd('lev')" onmouseleave="holdCancel('lev')"
            ontouchstart="holdStart('lev')" ontouchend="holdEnd('lev')">
            VIS LEVEREDE <span class="lev-count" id="levCount"></span><span class="peek-bar"></span>
        </button>
        <button class="filter-btn" id="btnIgang"
            onmousedown="holdStart('igang')" onmouseup="holdEnd('igang')" onmouseleave="holdCancel('igang')"
            ontouchstart="holdStart('igang')" ontouchend="holdEnd('igang')">
            IGANG<span class="peek-bar"></span>
        </button>
        <button class="filter-btn" id="btnKlar"
            onmousedown="holdStart('klar')" onmouseup="holdEnd('klar')" onmouseleave="holdCancel('klar')"
            ontouchstart="holdStart('klar')" ontouchend="holdEnd('klar')">
            KLAR<span class="peek-bar"></span>
        </button>
    </div>
</header>

<!-- KORT RENDERES DYNAMISK -->
<div class="view-content">
    <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- SCRIPTS (rækkefølge er vigtig) -->
<script src="/BonConfig.js"></script>
<script src="/BonConfigBar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/bon_kort.js"></script>
<script src="/shared/modal.js"></script>
<script src="/kitchen/today.js"></script>

</body>
</html>
