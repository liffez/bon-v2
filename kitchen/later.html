<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Køkken Senere — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/components.css">
    <link rel="stylesheet" href="/shared/bon_kort.css">
    <link rel="stylesheet" href="/shared/vare_picker.css">
    <link rel="stylesheet" href="/shared/modal.css">
    <link rel="stylesheet" href="/shared/mail_thread.css">
    <link rel="stylesheet" href="/shared/flyver.css">
    <link rel="stylesheet" href="/shared/bon_drawer.css">
    <link rel="stylesheet" href="/shared/kunde_soeg.css">
    <link rel="stylesheet" href="/shared/help-system.css">
    <link rel="stylesheet" href="/shared/sidekick.css">
    <style>
        /* ═══ RESET + BASE ═══ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* ═══ LATER HEADER ═══ */
        .later-header {
            background: white; border-bottom: 1px solid var(--color-border);
            padding: 10px 24px; position: sticky; top: 44px; z-index: 200;
            display: flex; align-items: center; gap: 16px;
        }
        .later-title { font-size: 18px; font-weight: 700; }
        .later-count { font-size: 13px; color: var(--color-text-dim); }

        /* ═══ LAYOUT ═══ */
        .view-content { padding: 20px 24px; }

        /* ═══ DATO-SEKTIONER ═══ */
        .date-section { margin-bottom: 28px; }
        .date-header {
            font-size: 15px; font-weight: 700; color: var(--color-text);
            margin-bottom: 12px; padding-bottom: 6px;
            border-bottom: 2px solid var(--color-border);
            display: flex; align-items: baseline; gap: 10px;
        }
        .date-header-count {
            font-size: 12px; font-weight: 400; color: var(--color-text-dim);
        }

        /* ═══ TILBUD-SEKTION ═══ */
        .tilbud-section { margin-top: 36px; }
        .tilbud-header {
            font-size: 15px; font-weight: 700; color: var(--brand-primary);
            margin-bottom: 12px; padding-bottom: 6px;
            border-bottom: 2px solid var(--brand-primary-light);
            display: flex; align-items: baseline; gap: 10px;
        }
        .tilbud-header-count {
            font-size: 12px; font-weight: 400; color: var(--color-text-dim);
        }

        /* ═══ KORT GRID ═══ */
        .cards-grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }

        /* ═══ EMPTY STATE ═══ */
        .empty-state {
            padding: 40px; color: var(--color-text-dim); font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-later" data-help-page-name="Køkken — Senere">

<!-- LATER HEADER -->
<header class="later-header">
    <div class="later-title">Senere</div>
    <span class="later-count" id="laterCount">0 bons</span>
</header>

<!-- INDHOLD RENDERES DYNAMISK -->
<div class="view-content">
    <div id="dateGroups"></div>
    <div id="tilbudSection"></div>
</div>

<!-- SCRIPTS (rækkefølge er vigtig) -->
<script src="/BonConfig.js"></script>
<script src="/BonConfigBar.js"></script>
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/delivery_icons.js"></script>
<script src="/shared/moms.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/mail_thread.js"></script>
<script src="/shared/vare_picker.js"></script>
<script src="/shared/bon_kort_builder.js"></script>
<script src="/shared/bon_kort.js"></script>
<script src="/shared/modal.js"></script>
<script src="/shared/flyver.js"></script>
<script src="/shared/kunde_soeg.js"></script>
<script src="/shared/flag_strip.js"></script>
<script src="/shared/bon_drawer.js"></script>
<script>
    var _laterDrawer = new BonDrawer();
    window._bonInfoEditHandler = function(bonId, opts) {
        _laterDrawer.open(bonId, opts);
    };
</script>
<script src="/kitchen/later.js"></script>
<script src="/shared/help-system.js"></script>
<script src="/shared/sidekick.js"></script>

</body>
</html>
