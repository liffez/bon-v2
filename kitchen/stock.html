<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lager — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/mangde_felter.css?v=2026-09-19">
    <link rel="stylesheet" href="/shared/stock_overview.css?v=2026-09-19">
    <link rel="stylesheet" href="/shared/inventory_check.css?v=2026-09-19">
    <link rel="stylesheet" href="/shared/product_create.css?v=2026-09-18">
    <link rel="stylesheet" href="/shared/help-system.css">
    <style>
        /* RESET + BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* TAB BAR */
        .tab-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px; display: flex; gap: 0;
        }
        .tab-bar a {
            padding: 12px 20px; font-size: 14px; font-weight: 700;
            color: var(--color-text-dim); text-decoration: none;
            border-bottom: 3px solid transparent; transition: all 0.15s; cursor: pointer;
        }
        .tab-bar a:hover { color: var(--color-text); }
        .tab-bar a.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }

        /* CONTENT */
        #stockOverviewContainer { padding: 20px 24px; }
        #inventoryCheckContainer { padding: 20px 24px; display: none; }
        #productCreateContainer { padding: 20px 24px; display: none; }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-stock" data-help-page-name="Køkken — Lager">

<!-- TAB BAR -->
<div class="tab-bar">
    <a href="#" id="tabOverview" class="active">Lageroversigt</a>
    <a href="#" id="tabCheck">Optælling</a>
    <a href="#" id="tabCreate">Opret produkt</a>
    <a href="#" id="tabVeje">CO₂ kg-vej</a>
</div>

<!-- CONTENT -->
<div id="stockOverviewContainer"></div>
<div id="inventoryCheckContainer"></div>
<div id="productCreateContainer"></div>
<div id="co2VejeContainer" style="display:none"></div>

<!-- SCRIPTS -->
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/mangde_felter.js?v=2026-09-19"></script>
<script src="/shared/stock_overview.js?v=2026-09-19"></script>
<script src="/shared/inventory_check.js?v=2026-09-19"></script>
<script src="/shared/product_create.js?v=2026-09-18"></script>
<script src="/shared/co2_veje.js"></script>
<script>
    var _checkInitialized = false;
    var _createInitialized = false;
    var _vejeInitialized = false;

    document.addEventListener('DOMContentLoaded', async function() {
        var currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        var overviewContainer = document.getElementById('stockOverviewContainer');
        var checkContainer = document.getElementById('inventoryCheckContainer');
        var createContainer = document.getElementById('productCreateContainer');
        var vejeContainer = document.getElementById('co2VejeContainer');
        var tabOverview = document.getElementById('tabOverview');
        var tabCheck = document.getElementById('tabCheck');
        var tabCreate = document.getElementById('tabCreate');
        var tabVeje = document.getElementById('tabVeje');
        var allTabs = [tabOverview, tabCheck, tabCreate, tabVeje];
        var allContainers = [overviewContainer, checkContainer, createContainer, vejeContainer];
        function _activate(tab, cont, suffix) {
            allTabs.forEach(function(t){ t.classList.toggle('active', t === tab); });
            allContainers.forEach(function(c){ c.style.display = c === cont ? 'block' : 'none'; });
            _setUrl(suffix || '');
        }

        // Init overview by default
        initStockOverview(overviewContainer);

        // Tab fra ?tab= eller hash
        var qs = new URLSearchParams(window.location.search);
        var tabParam = qs.get('tab');
        var prefillBarcode = qs.get('barcode');

        if (tabParam === 'create' || (window.location.hash === '#opret-produkt')) {
            switchToCreate(prefillBarcode);
        } else if (window.location.hash === '#optalning') {
            switchToCheck();
        }

        tabOverview.addEventListener('click', function(e) {
            e.preventDefault();
            _activate(tabOverview, overviewContainer, '');
        });

        tabCheck.addEventListener('click', function(e) {
            e.preventDefault();
            switchToCheck();
        });

        tabCreate.addEventListener('click', function(e) {
            e.preventDefault();
            switchToCreate(null);
        });

        tabVeje.addEventListener('click', function(e) {
            e.preventDefault();
            switchToVeje();
        });

        if (window.location.hash === '#kg-vej') switchToVeje();

        function switchToVeje() {
            _activate(tabVeje, vejeContainer, '#kg-vej');
            if (!_vejeInitialized) {
                initCo2Veje(vejeContainer);
                _vejeInitialized = true;
            }
        }

        // Når brugeren klikker "Tilbage til lager" i resultat-kortet
        window._pcOnDone = function() {
            tabOverview.click();
        };

        function switchToCheck() {
            _activate(tabCheck, checkContainer, '#optalning');
            if (!_checkInitialized) {
                initInventoryCheck(checkContainer);
                _checkInitialized = true;
            }
        }

        function switchToCreate(barcode) {
            _activate(tabCreate, createContainer,
                barcode ? ('?tab=create&barcode=' + encodeURIComponent(barcode)) : '#opret-produkt');
            if (!_createInitialized) {
                initProductCreate(createContainer, { barcode: barcode || null });
                _createInitialized = true;
            }
        }

        function _setUrl(suffix) {
            var base = window.location.pathname;
            window.history.replaceState({}, '', base + (suffix || ''));
        }
    });
</script>
<script src="/shared/help-system.js"></script>
</body>
</html>
