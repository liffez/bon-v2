<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indkøb — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/indkob.css">
    <link rel="stylesheet" href="/shared/varemodtagelse.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }
        .tab-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px;
            display: flex;
            gap: 0;
        }
        .tab-bar a {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: var(--color-text-dim);
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            cursor: pointer;
        }
        .tab-bar a:hover { color: var(--color-text); }
        .tab-bar a.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
        #indkobContainer { /* no padding — indkob.js handles layout */ }
        #receivingContainer { padding: 20px 24px; display: none; }
    </style>
</head>
<body class="zone-kitchen">

<!-- TAB BAR -->
<div class="tab-bar">
    <a href="#" id="tabIndkob" class="active">Indkøb</a>
    <a href="#" id="tabReceiving">Varemodtagelse</a>
</div>

<!-- CONTENT -->
<div id="indkobContainer"></div>
<div id="receivingContainer"></div>

<!-- SCRIPTS -->
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/indkob.js"></script>
<script src="/shared/varemodtagelse.js"></script>
<script>
    var _indkobInitialized = false;
    var _varemodtagelseInitialized = false;

    document.addEventListener('DOMContentLoaded', async function() {
        var currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        var indkobContainer = document.getElementById('indkobContainer');
        var receivingContainer = document.getElementById('receivingContainer');
        var tabIndkob = document.getElementById('tabIndkob');
        var tabReceiving = document.getElementById('tabReceiving');

        // Init indkob by default
        initIndkob(indkobContainer);
        _indkobInitialized = true;

        // Check URL hash
        if (window.location.hash === '#varemodtagelse') {
            switchTo('receiving');
        }

        tabIndkob.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('indkob');
        });

        tabReceiving.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('receiving');
        });

        function switchTo(tab) {
            tabIndkob.classList.toggle('active', tab === 'indkob');
            tabReceiving.classList.toggle('active', tab === 'receiving');

            indkobContainer.style.display = tab === 'indkob' ? 'block' : 'none';
            receivingContainer.style.display = tab === 'receiving' ? 'block' : 'none';

            if (tab === 'indkob') window.location.hash = '';
            if (tab === 'receiving') window.location.hash = 'varemodtagelse';

            // Varemodtagelse: reload ved hvert tab-skift
            if (tab === 'receiving') {
                initVaremodtagelse(receivingContainer);
                _varemodtagelseInitialized = true;
            }
        }
    });
</script>
</body>
</html>
