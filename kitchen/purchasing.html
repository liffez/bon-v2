<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indkøb — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/indkob.css">
    <link rel="stylesheet" href="/shared/indkob_settings.css">
    <link rel="stylesheet" href="/shared/product_create.css">
    <link rel="stylesheet" href="/shared/varemodtagelse.css">
    <link rel="stylesheet" href="/shared/mail_thread.css">
    <link rel="stylesheet" href="/shared/help-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }
        .tab-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px;
            display: flex;
            gap: 0;
        }
        .tab-bar a {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: var(--color-text-dim);
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            cursor: pointer;
        }
        .tab-bar a:hover { color: var(--color-text); }
        .tab-bar a.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
        #indkobContainer { /* no padding — indkob.js handles layout */ }
        #receivingContainer { padding: 20px 24px; display: none; }
        .tab-badge {
            background: #e53e3e; color: #fff;
            font-size: 10px; font-weight: 700;
            padding: 1px 6px; border-radius: 8px;
            margin-left: 4px; vertical-align: middle;
        }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-purchasing" data-help-page-name="Køkken — Indkøb">

<!-- TAB BAR -->
<div class="tab-bar">
    <a href="#" id="tabIndkob" class="active">Indkøb</a>
    <a href="#" id="tabReceiving">Varemodtagelse</a>
    <a href="#" id="tabPost">Post <span id="postBadge" class="tab-badge" style="display:none"></span></a>
</div>

<!-- CONTENT -->
<div id="indkobContainer"></div>
<div id="receivingContainer"></div>
<div id="postContainer" style="display:none;padding:20px 24px"></div>

<!-- SETTINGS SLIDE-IN -->
<div class="is-overlay" id="isOverlay" onclick="toggleIndkobSettings()"></div>
<div class="is-panel" id="isPanel"></div>

<!-- SCRIPTS -->
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/bon_lines.js"></script>
<script src="/shared/mail_thread.js"></script>
<script src="/shared/product_create.js"></script>
<script src="/shared/indkob.js"></script>
<script src="/shared/indkob_settings.js"></script>
<script src="/shared/varemodtagelse.js"></script>
<script src="/shared/supplier_inbox.js"></script>
<script>
    var _indkobInitialized = false;
    var _varemodtagelseInitialized = false;
    var _postInitialized = false;
    var _ibSettingsOpen = false;
    var _ibSettingsInitialized = false;

    function toggleIndkobSettings() {
        _ibSettingsOpen = !_ibSettingsOpen;
        document.getElementById('isPanel').classList.toggle('on', _ibSettingsOpen);
        document.getElementById('isOverlay').classList.toggle('on', _ibSettingsOpen);
        var gearBtn = document.getElementById('ibGearBtn');
        if (gearBtn) gearBtn.classList.toggle('active', _ibSettingsOpen);

        if (_ibSettingsOpen && !_ibSettingsInitialized) {
            initIndkobSettings(document.getElementById('isPanel'), { mode: 'panel' });
            _ibSettingsInitialized = true;
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && _ibSettingsOpen) toggleIndkobSettings();
    });

    document.addEventListener('DOMContentLoaded', async function() {
        var currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        // Inject gear button into tab-bar
        var tabBar = document.querySelector('.tab-bar');
        if (tabBar) {
            var gear = document.createElement('button');
            gear.className = 'is-gear-btn';
            gear.id = 'ibGearBtn';
            gear.title = 'Indkøbsindstillinger';
            gear.textContent = '⚙';
            gear.style.marginLeft = 'auto';
            gear.onclick = function(e) { e.stopPropagation(); toggleIndkobSettings(); };
            tabBar.appendChild(gear);
        }

        var indkobContainer = document.getElementById('indkobContainer');
        var receivingContainer = document.getElementById('receivingContainer');
        var postContainer = document.getElementById('postContainer');
        var tabIndkob = document.getElementById('tabIndkob');
        var tabReceiving = document.getElementById('tabReceiving');
        var tabPost = document.getElementById('tabPost');

        // Init indkob by default
        initIndkob(indkobContainer);
        _indkobInitialized = true;

        // Check URL hash
        if (window.location.hash === '#varemodtagelse') {
            switchTo('receiving');
        } else if (window.location.hash === '#post') {
            switchTo('post');
        }

        tabIndkob.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('indkob');
        });

        tabReceiving.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('receiving');
        });

        tabPost.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('post');
        });

        function switchTo(tab) {
            tabIndkob.classList.toggle('active', tab === 'indkob');
            tabReceiving.classList.toggle('active', tab === 'receiving');
            tabPost.classList.toggle('active', tab === 'post');

            indkobContainer.style.display = tab === 'indkob' ? 'block' : 'none';
            receivingContainer.style.display = tab === 'receiving' ? 'block' : 'none';
            postContainer.style.display = tab === 'post' ? 'block' : 'none';

            if (tab === 'indkob') window.location.hash = '';
            if (tab === 'receiving') window.location.hash = 'varemodtagelse';
            if (tab === 'post') window.location.hash = 'post';

            // Varemodtagelse: reload ved hvert tab-skift
            if (tab === 'receiving') {
                initVaremodtagelse(receivingContainer);
                _varemodtagelseInitialized = true;
            }

            // Post: init or refresh
            if (tab === 'post') {
                if (_postInitialized) {
                    // Refresh data when switching back
                    if (typeof _siLoadData === 'function') _siLoadData();
                } else {
                    initSupplierInbox(postContainer, {});
                    _postInitialized = true;
                }
            }
        }

        // SSE for post badge (runs regardless of active tab).
        // manageSSE lukker ved navigation — denne side har to streams (denne +
        // indkob.js'), så en efterladt stream tæller dobbelt her.
        var postSSE = manageSSE(function() {
            var es = new EventSource('/api/sse');
            es.addEventListener('po_mail_received', function(e) {
                updatePostBadge();
                if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_received', JSON.parse(e.data));
            });
            es.addEventListener('po_mail_sent', function(e) {
                if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_sent', JSON.parse(e.data));
            });
            es.addEventListener('supplier_mail_received', function(e) {
                updatePostBadge();
                if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_received', JSON.parse(e.data));
            });
            es.addEventListener('supplier_mail_sent', function(e) {
                if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_sent', JSON.parse(e.data));
            });
            return es;
        });

        // Initial badge load
        updatePostBadge();

        async function updatePostBadge() {
            try {
                var poRes = await fetchOrderMailThreads({ unread_only: true });
                var supRes = await fetchSupplierMailOverview(true).catch(function() { return { threads: [] }; });
                var total = 0;
                for (var i = 0; i < poRes.length; i++) total += (poRes[i].unread_count || 0);
                var supThreads = (supRes && supRes.threads) || [];
                for (var j = 0; j < supThreads.length; j++) total += (supThreads[j].unread_count || 0);
                var badge = document.getElementById('postBadge');
                if (badge) {
                    badge.textContent = total;
                    badge.style.display = total > 0 ? '' : 'none';
                }
            } catch (e) {}
        }
    });
</script>
<script src="/shared/help-system.js"></script>
</body>
</html>
