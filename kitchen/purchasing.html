<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indkøb — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/shopping_list.css">
    <style>
        /* RESET + BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            background: var(--brand-primary); color: white;
            padding: 0 24px; height: 44px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 300;
        }
        .topbar-left  { display: flex; align-items: center; gap: 4px; }
        .topbar-logo  { font-size: 15px; font-weight: 700; margin-right: 16px; }
        .topbar-nav a {
            color: rgba(255,255,255,0.65); text-decoration: none;
            font-size: 13px; font-weight: 700; padding: 0 12px;
            height: 44px; display: inline-flex; align-items: center;
            border-bottom: 3px solid transparent; transition: all 0.15s;
        }
        .topbar-nav a:hover  { color: white; }
        .topbar-nav a.active { color: white; border-bottom-color: rgba(255,255,255,0.55); }

        /* MERE dropdown */
        .topbar-more { position: relative; display: inline-flex; align-items: center; }
        .topbar-more summary {
            color: white; border-bottom-color: rgba(255,255,255,0.55);
            font-size: 13px; font-weight: 700; padding: 0 12px;
            height: 44px; display: inline-flex; align-items: center;
            border-bottom: 3px solid transparent; cursor: pointer; list-style: none;
        }
        .topbar-more summary::-webkit-details-marker { display: none; }
        .topbar-more[open] summary { border-bottom-color: rgba(255,255,255,0.55); }
        .topbar-more .dropdown {
            position: absolute; top: 44px; right: 0;
            background: white; border: 1px solid var(--color-border);
            border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            min-width: 180px; z-index: 400; padding: 4px 0;
        }
        .topbar-more .dropdown a {
            color: var(--color-text); display: block;
            padding: 10px 16px; font-size: 14px; font-weight: 600;
            border-bottom: none; height: auto; transition: background 0.1s;
        }
        .topbar-more .dropdown a:hover { background: var(--color-background); }
        .topbar-more .dropdown a.active-sub { color: var(--brand-primary); background: var(--brand-primary-light); }

        .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .live-dot { display: flex; align-items: center; gap: 5px; opacity: 0.8; }
        .live-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #7cdb5e; display: block; }

        /* TAB BAR */
        .tab-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0 24px; display: flex; gap: 0;
        }
        .tab-bar a {
            padding: 12px 20px; font-size: 14px; font-weight: 700;
            color: var(--color-text-dim); text-decoration: none;
            border-bottom: 3px solid transparent; transition: all 0.15s; cursor: pointer;
        }
        .tab-bar a:hover { color: var(--color-text); }
        .tab-bar a.active { color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
        .tab-bar a.disabled {
            opacity: 0.35; pointer-events: none; cursor: default;
        }

        /* CONTENT */
        #shoppingListContainer { padding: 0; }
        #orderContainer { padding: 20px 24px; display: none; }
        #receivingContainer { padding: 20px 24px; display: none; }

        .placeholder-msg {
            text-align: center; padding: 60px 20px;
            color: var(--color-text-dim);
        }
        .placeholder-msg .ph-icon { font-size: 42px; margin-bottom: 12px; }
        .placeholder-msg .ph-title { font-size: 16px; font-weight: 700; color: var(--color-text); margin-bottom: 6px; }
        .placeholder-msg .ph-sub { font-size: 14px; }
    </style>
</head>
<body class="zone-kitchen">

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">Ristet Rug</span>
        <nav class="topbar-nav">
            <a href="/kitchen/">DASHBOARD</a>
            <a href="/kitchen/today.html">I DAG</a>
            <a href="/kitchen/later.html">SENERE</a>
            <a href="/kitchen/calendar.html">KALENDER</a>
            <a href="/kitchen/planning.html">PLANLÆGNING</a>
            <details class="topbar-more">
                <summary>MERE ▾</summary>
                <div class="dropdown">
                    <a href="/kitchen/recipes.html">Opskrifter</a>
                    <a href="/kitchen/stock.html">Lager</a>
                    <a href="/kitchen/purchasing.html" class="active-sub">Indkøb</a>
                    <a href="/kitchen/vagtplan.html">Vagtplan</a>
                </div>
            </details>
        </nav>
    </div>
    <div class="topbar-right">
        <span class="live-dot">Live</span>
    </div>
</header>

<!-- TAB BAR -->
<div class="tab-bar">
    <a href="#" id="tabShopping" class="active">Indkøbsliste</a>
    <a href="#" id="tabOrders" class="disabled">Bestilling</a>
    <a href="#" id="tabReceiving">Varemodtagelse ↗</a>
</div>

<!-- CONTENT -->
<div id="shoppingListContainer"></div>
<div id="orderContainer">
    <div class="placeholder-msg">
        <div class="ph-icon">📋</div>
        <div class="ph-title">Bestilling</div>
        <div class="ph-sub">Kommer snart — PO, leverandørpriser, ordreflow</div>
    </div>
</div>
<div id="receivingContainer">
    <div class="placeholder-msg">
        <div class="ph-icon">🚛</div>
        <div class="ph-title">Varemodtagelse</div>
        <div class="ph-sub">Kommer snart — Fødevarekontrol + lager</div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/shopping_list.js"></script>
<script>
    var _shoppingInitialized = false;

    document.addEventListener('DOMContentLoaded', async function() {
        var currentUser = await checkAuth();
        if (!currentUser) return;
        renderZoneSwitcher('kitchen', currentUser.role, document.querySelector('.topbar-left'));

        var shoppingContainer = document.getElementById('shoppingListContainer');
        var orderContainer = document.getElementById('orderContainer');
        var receivingContainer = document.getElementById('receivingContainer');
        var tabShopping = document.getElementById('tabShopping');
        var tabOrders = document.getElementById('tabOrders');
        var tabReceiving = document.getElementById('tabReceiving');

        // Init shopping list by default
        initShoppingList(shoppingContainer);
        _shoppingInitialized = true;

        // Check URL hash
        if (window.location.hash === '#bestilling') {
            switchTo('orders');
        } else if (window.location.hash === '#varemodtagelse') {
            switchTo('receiving');
        }

        tabShopping.addEventListener('click', function(e) {
            e.preventDefault();
            switchTo('shopping');
        });

        tabOrders.addEventListener('click', function(e) {
            e.preventDefault();
            if (tabOrders.classList.contains('disabled')) return;
            switchTo('orders');
        });

        tabReceiving.addEventListener('click', function(e) {
            e.preventDefault();
            window.open('https://whiteboard.ristetrug.dk?open=varemodtagelse', '_blank');
        });

        function switchTo(tab) {
            tabShopping.classList.toggle('active', tab === 'shopping');
            tabOrders.classList.toggle('active', tab === 'orders');
            tabReceiving.classList.toggle('active', tab === 'receiving');

            shoppingContainer.style.display = tab === 'shopping' ? 'block' : 'none';
            orderContainer.style.display = tab === 'orders' ? 'block' : 'none';
            receivingContainer.style.display = tab === 'receiving' ? 'block' : 'none';

            if (tab === 'shopping') window.location.hash = '';
            if (tab === 'orders') window.location.hash = 'bestilling';
            if (tab === 'receiving') window.location.hash = 'varemodtagelse';
        }
    });

    // Close MERE dropdown
    document.addEventListener('click', function(e) {
        var details = document.querySelector('.topbar-more');
        if (details && details.open && !details.contains(e.target)) {
            details.removeAttribute('open');
        }
    });
</script>
</body>
</html>
