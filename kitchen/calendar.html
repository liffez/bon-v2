<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender — Bon v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/tokens.css">
    <link rel="stylesheet" href="/shared/density.css">
    <script src="/shared/density.js"></script>
    <link rel="stylesheet" href="/shared/kitchen_topbar.css">
    <link rel="stylesheet" href="/shared/modal.css">
    <link rel="stylesheet" href="/shared/flyver.css">
    <link rel="stylesheet" href="/shared/mail_thread.css">
    <link rel="stylesheet" href="/shared/calendar.css">
    <link rel="stylesheet" href="/shared/kunde_soeg.css">
    <link rel="stylesheet" href="/shared/bon_opret_modal.css">
    <link rel="stylesheet" href="/shared/bon_drawer.css">
    <link rel="stylesheet" href="/shared/vare_picker.css">
    <link rel="stylesheet" href="/shared/help-system.css">
    <link rel="stylesheet" href="/shared/sidekick.css">
    <style>
        /* ═══ RESET + BASE ═══ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lato', sans-serif;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
        }
    </style>
</head>
<body class="zone-kitchen" data-help-page="kitchen-calendar" data-help-page-name="Køkken — Kalender">

<!-- KALENDER RENDERES HER -->
<div id="calendarContainer"></div>

<!-- SCRIPTS (rækkefølge er vigtig) -->
<script src="/BonConfig.js"></script>
<script src="/BonConfigBar.js"></script>
<script src="/shared/zone_switcher.js"></script>
<script src="/shared/kitchen_topbar.js"></script>
<script src="/shared/utils.js"></script>
<script src="/shared/delivery_icons.js"></script>
<script src="/shared/moms.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/mail_thread.js"></script>
<script src="/shared/modal.js"></script>
<script src="/shared/flyver.js"></script>
<script src="/shared/calendar.js"></script>
<script src="/shared/kunde_soeg.js"></script>
<script src="/shared/bon_opret_modal.js"></script>
<script src="/shared/vare_picker.js"></script>
<script src="/shared/flag_strip.js"></script>
<script src="/shared/bon_drawer.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const currentUser = await checkAuth();
        if (!currentUser) return;
        renderKitchenTopbar(document.body, { user: currentUser });

        // ─── Drawer ──────────────────────────────────────
        const drawer = new BonDrawer();

        function openDrawer(bonId) {
            const url = new URL(window.location);
            url.searchParams.set('bon', bonId);
            history.pushState({}, '', url);
            drawer.load(bonId);
            drawer.show();
        }

        // Override drawer hide for URL-sync
        const origHide = drawer.hide.bind(drawer);
        drawer.hide = function() {
            origHide();
            const url = new URL(window.location);
            if (url.searchParams.has('bon')) {
                url.searchParams.delete('bon');
                history.pushState({}, '', url);
            }
        };

        // ─── Modal ───────────────────────────────────────
        const modal = new BonOpretModal({
            onCreated: (bonId) => { drawer.open(bonId, { justCreated: true }); }
        });

        // ─── Kalender (med onEdit callback) ──────────────
        initCalendar(document.getElementById('calendarContainer'), {
            zone: 'kitchen',
            showStaff: true,
            onEdit: (bonId) => openDrawer(bonId),
            onBonClick: (bonId) => openDrawer(bonId),
        });

        // Ny bon button (rendered inside calendar header by calendar.js — skal wires EFTER initCalendar)
        const nyBonBtn = document.getElementById('calNyBon');
        if (nyBonBtn) nyBonBtn.addEventListener('click', () => modal.open());

        // ─── URL-sync ────────────────────────────────────
        const bonIdFromUrl = new URLSearchParams(window.location.search).get('bon');
        if (bonIdFromUrl) openDrawer(bonIdFromUrl);

        window.addEventListener('popstate', function() {
            const bonId = new URLSearchParams(window.location.search).get('bon');
            if (bonId) {
                drawer.load(bonId);
                drawer.show();
            } else {
                drawer.el.classList.remove('open');
                drawer.overlayEl.classList.remove('open');
                document.body.style.overflow = '';
                drawer.dirty = false;
            }
        });
    });
</script>
<script src="/shared/help-system.js"></script>
<script src="/shared/sidekick.js"></script>

</body>
</html>
