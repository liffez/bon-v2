  <style>
    /* ── Shell layout ───────────────────────────────────────── */
    .office-shell {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }
    .office-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-m, 16px) var(--space-l, 24px);
      border-bottom: 1px solid var(--color-border, #d7d1ca);
      background: var(--color-surface, #fff);
      flex-shrink: 0;
    }
    .office-topbar h1 {
      font-family: var(--font-heading, 'Playfair Display', Georgia, serif);
      font-size: var(--font-size-l, 18px);
      margin: 0;
      font-weight: 700;
    }
    .office-topbar-hamburger {
      display: none;
      background: transparent;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      width: 36px;
      height: 32px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      align-items: center;
      justify-content: center;
      color: var(--color-text, #333);
      margin-right: 8px;
      flex-shrink: 0;
    }
    .office-topbar-hamburger:hover { background: var(--color-background, #f5f4f2); }
    .office-sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
    }
    .office-sidebar-backdrop.open { display: block; }

    /* Global search i topbar */
    .office-topbar-search {
      flex: 1;
      max-width: 360px;
      margin: 0 16px;
    }
    .office-topbar-search-input {
      width: 100%;
      padding: 7px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
      background: var(--color-background, #f5f4f2);
      color: var(--color-text, #333);
      transition: background 0.15s, border-color 0.15s;
    }
    .office-topbar-search-input:focus {
      outline: none;
      background: var(--color-surface, #fff);
      border-color: var(--brand-primary, #8e631f);
    }
    .office-topbar-search-input::placeholder {
      color: var(--color-text-dim, #888);
    }

    /* ── Fælles "Nyt der kræver handling"-indikator ── */
    .office-attn-btn {
      display: flex; align-items: center; gap: 6px;
      background: transparent;
      border: 1px solid var(--color-border, #d7d1ca);
      color: #6B4C2A;
      padding: 6px 10px; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit;
    }
    .office-attn-btn:hover { background: var(--color-background, #f5f4f2); }
    .office-attn-btn.has-new { border-color: #E24B4A; }
    .office-attn-btn.pulse { animation: attnPulse 1.2s ease-in-out 3; }
    @keyframes attnPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(226,75,74,0); }
      50%      { box-shadow: 0 0 0 4px rgba(226,75,74,0.28); }
    }
    .office-attn-count {
      background: #E24B4A; color: #fff;
      font-size: 11px; font-weight: 500;
      min-width: 18px; height: 18px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    .office-attn-panel {
      position: absolute; top: calc(100% + 8px); right: 0;
      width: 380px; max-width: 90vw;
      background: #fff;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 1200; overflow: hidden;
      max-height: 70vh; overflow-y: auto;
    }
    .office-attn-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--color-border, #eee);
      font-size: 14px; font-weight: 500;
    }
    .office-attn-grp {
      padding: 10px 14px 4px; display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; color: #666;
    }
    .office-attn-grp.sep { border-top: 1px solid var(--color-border, #eee); margin-top: 4px; }
    .office-attn-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer;
    }
    .office-attn-row:hover { background: var(--color-background, #f5f4f2); }
    .office-attn-row.web  { border-left: 3px solid #EF9F27; }
    .office-attn-row.mail { border-left: 3px solid #378ADD; }
    .office-attn-row .ar-main { flex: 1; min-width: 0; }
    .office-attn-row .ar-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .office-attn-row .ar-sub { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .office-attn-ack {
      font-size: 11px; padding: 4px 9px; cursor: pointer; white-space: nowrap;
      border: 1px solid var(--color-border, #d7d1ca); border-radius: 6px;
      background: #fff; color: #6B4C2A; font-family: inherit;
    }
    .office-attn-ack:hover { background: var(--color-background, #f5f4f2); }
    .office-attn-tag {
      font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    }
    .office-attn-tag.uf  { background: #FAEEDA; color: #854F0B; }
    .office-attn-tag.kc  { background: #E6F1FB; color: #0C447C; }
    .office-attn-empty { padding: 24px 14px; text-align: center; color: #999; font-size: 13px; }
    .office-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    .office-sidebar {
      width: 210px;
      flex-shrink: 0;
      background: #6B4C2A;
      display: flex;
      flex-direction: column;
      padding: 0;
      color: rgba(255,255,255,0.78);
      font-family: var(--font-body, 'DM Sans', system-ui, sans-serif);
    }
    .sidebar-brand {
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-brand-name {
      font-family: var(--font-heading, 'Playfair Display', Georgia, serif);
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      line-height: 1.2;
    }
    .sidebar-brand-sub {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #C8962A;
      margin-top: 2px;
    }
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 8px 8px;
      overflow-y: auto;
    }
    .sidebar-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(255,255,255,0.35);
      padding: 14px 12px 5px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: rgba(255,255,255,0.72);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      width: 100%;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      position: relative;
    }
    .sidebar-link:hover {
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.97);
    }
    .sidebar-link.active {
      background: rgba(255,255,255,0.13);
      color: #F1E6B2;
      font-weight: 700;
      border-left: 3px solid #C8962A;
      padding-left: 9px;
    }
    .sidebar-link.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    .sidebar-link .sidebar-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }
    .sidebar-badge {
      margin-left: auto;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #C94040;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .sidebar-badge.gold { background: #C8962A; }
    .sidebar-badge.mail { background: #d4781a; }
    /* Når et nav-punkt har to badges sidder kun den første mod højre kant —
       de øvrige følger umiddelbart efter. */
    .sidebar-badge ~ .sidebar-badge { margin-left: 4px; }
    .sidebar-bottom {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }
    .sidebar-user-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #C8962A 0%, #8e631f 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .sidebar-user-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .sidebar-user-role { font-size: 10px; color: rgba(255,255,255,0.45); }

    /* ── Content ────────────────────────────────────────────── */
    #office-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-l, 24px);
    }

    /* ── Bons List ─────────────────────────────────────────── */

    .bl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-search-wrap { flex: 1; min-width: 200px; }
    .bl-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--color-surface, #fff);
    }
    .bl-search:focus { outline: 2px solid var(--brand-primary, #8e631f); outline-offset: -1px; }
    .bl-toolbar-right { display: flex; align-items: center; gap: 8px; }
    .bl-ny-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-ny-btn:hover { filter: brightness(1.1); }

    /* Column chooser */
    .bl-col-chooser { position: relative; }
    .bl-col-btn {
      padding: 8px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-col-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-col-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 8px;
      z-index: 100;
      min-width: 180px;
    }
    .bl-col-dropdown.open { display: block; }
    .bl-col-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .bl-col-item:hover { background: var(--color-background, #f5f4f2); }

    /* Filters */
    .bl-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 20px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .bl-filter-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-filter-btn.active {
      background: var(--brand-primary, #8e631f);
      color: #fff;
      border-color: var(--brand-primary, #8e631f);
    }
    .bl-filter-badge {
      display: inline-block;
      min-width: 16px;
      padding: 1px 5px;
      border-radius: 9px;
      background: #d4781a;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      vertical-align: middle;
    }
    /* På aktivt (brunt) filter står badgen hvid med brun tekst for kontrast. */
    .bl-filter-btn.active .bl-filter-badge { background: #fff; color: var(--brand-primary, #8e631f); }
    .bl-date-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }
    .bl-date-wrap label { color: var(--color-text-dim, #888); white-space: nowrap; }
    .bl-date-input {
      padding: 5px 8px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    /* Summary */
    .bl-summary {
      padding: 10px 16px;
      background: var(--brand-primary-light, #f1e6b2);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-primary, #8e631f);
      margin-bottom: 12px;
    }

    /* Table */
    .bl-table-wrap { overflow-x: auto; }
    .bl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .bl-th {
      padding: 8px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--color-text-dim, #888);
      border-bottom: 2px solid var(--color-border, #d7d1ca);
      white-space: nowrap;
      user-select: none;
    }
    .bl-th.bl-sortable { cursor: pointer; }
    .bl-th.bl-sortable:hover { color: var(--brand-primary, #8e631f); }
    .bl-th.bl-sorted::after {
      content: ' \25B2';
      font-size: 10px;
    }
    .bl-th.bl-sorted.desc::after {
      content: ' \25BC';
    }

    /* Rows */
    .bl-row { cursor: pointer; }
    .bl-row-main td {
      padding: 10px 12px 2px;
      border-top: 1px solid var(--color-border, #d7d1ca);
    }
    .bl-row-sub td {
      padding: 0 12px 8px;
      font-size: 13px;
    }
    .bl-row-main:first-child td { border-top: none; }
    .bl-row:hover td { background: var(--color-background, #f5f4f2); }
    .bl-row-main:hover + .bl-row-sub td { background: var(--color-background, #f5f4f2); }

    /* Production */
    .bl-production { border-left: 3px solid #3a7bd5; }
    .bl-prod-icon { font-size: 12px; }

    /* Cells */
    .bl-td-bon { font-weight: 700; white-space: nowrap; vertical-align: top; }
    .bl-bon-number { font-variant-numeric: tabular-nums; }
    .bl-td-date { white-space: nowrap; }
    .bl-td-date.bl-today { font-weight: 600; color: var(--brand-primary, #8e631f); }
    .bl-td-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .bl-td-status { vertical-align: top; white-space: nowrap; }
    .bl-td-num { text-align: right; font-variant-numeric: tabular-nums; }
    .bl-td-dim { color: var(--color-text-dim, #888); }
    .bl-td-opt { white-space: nowrap; }

    /* Status badge */
    .bl-status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .bl-status-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .bl-status-time {
      font-size: 11px;
      color: var(--color-text-dim, #888);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .bl-history-btn {
      background: transparent;
      border: 1px solid var(--color-border, #d7d1ca);
      color: var(--color-text-dim, #6b5f54);
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
      transition: background-color .12s, color .12s, border-color .12s;
    }
    .bl-history-btn:hover {
      background: var(--brand-primary, #8e631f);
      color: #fff;
      border-color: var(--brand-primary, #8e631f);
    }

    /* Mail */
    .bl-mail-icon {
      color: #d4781a;
      font-size: 13px;
      margin-left: 4px;
    }
    .bl-mail-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #d4781a;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    /* Ubekræftet web-bestilling — markør i Bon#-cellen */
    .bl-web-chip {
      display: inline-block;
      margin-top: 3px;
      padding: 1px 6px;
      border-radius: 8px;
      background: #fbe9e9;
      color: #a82828;
      border: 1px solid #eccaca;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.02em;
      cursor: help;
    }
    .bl-summary-web { color: #a82828; font-weight: 600; cursor: help; }

    /* Staff badge */
    .bl-staff-badge {
      display: inline-block;
      margin-left: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: default;
      vertical-align: middle;
    }

    /* Empty state */
    .bl-empty {
      text-align: center;
      padding: 40px 12px;
      color: var(--color-text-dim, #888);
      font-size: 15px;
    }

    /* ── Sidebar v2: clickable brand + zone-switch pill ─── */
    .sidebar-brand {
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-brand:hover { background: rgba(255,255,255,0.06); }
    .sidebar-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 3px;
    }
    .sidebar-zone-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .sidebar-brand:hover .sidebar-zone-pill {
      background: #C8962A;
      color: #4a3210;
      border-color: #C8962A;
    }

    /* ── Sidebar v2: footer icon row ──────────────────── */
    .sidebar-icon-row {
      display: flex;
      gap: 4px;
      padding: 4px 4px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 6px;
    }
    .sidebar-icon-row .icon-btn {
      width: 34px;
      height: 34px;
      background: transparent;

      color: rgba(255,255,255,0.65);
      font-size: 15px;
      cursor: pointer;

      align-items: center;

      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 6px);

    .office-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .office-main #office-content {
      flex: 1;
      overflow-y: auto;

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .office-topbar-hamburger { display: inline-flex; }
      .office-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.2s ease-out;
      }
      .office-sidebar.open { transform: translateX(0); }
    }
    @media (max-width: 600px) {
      #office-content { padding: var(--space-s, 8px); }
      .office-topbar-search { max-width: none; margin: 0 8px; }
      .bl-toolbar { flex-direction: column; }

  <script>
    (async () => {
      const currentUser = await checkAuth();
      if (!currentUser) return;

      // ─── Sidebar user ──────────────────────────────────────
      const userEl = document.getElementById('sidebar-user');
      if (userEl && currentUser) {
        const name = currentUser.name || currentUser.email || '';
        const init = name.charAt(0).toUpperCase();
        const role = currentUser.role === 'admin' ? 'Administrator' : currentUser.role === 'office' ? 'Kontor' : currentUser.role === 'kitchen' ? 'Køkken' : currentUser.role || '';
        userEl.innerHTML = `
          <div class="sidebar-user-av">${init}</div>
          <div><div class="sidebar-user-name">${name}</div><div class="sidebar-user-role">${role}</div></div>
        `;
      }

      // ─── Zone switcher i sidebar header (klikbar brand) ──
      // Vises kun for office/admin — kitchen-only roller har ikke adgang her.
      const brandEl = document.getElementById('sidebar-zone-switch');
      if (brandEl) {
        const canSwitch = ['office', 'admin'].includes(currentUser.role);
        if (canSwitch) {
          brandEl.addEventListener('click', () => { location.href = '/kitchen/'; });
        } else {
          brandEl.style.cursor = 'default';
          const pill = brandEl.querySelector('.sidebar-zone-pill');
          if (pill) pill.style.display = 'none';
        }
      }

      // ─── Logout ──────────────────────────────────────────
      document.getElementById('sidebar-logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      });

      // ─── Global søgefelt i topbar ───────────────────────
      // Enter → naviger til Bons-listen med ?q=<query>. Bons-list-viewet
      // håndterer selv q-param og udfører søgningen. Senere kan udvides
      // til at søge på tværs af kunder/varer via separat søge-endpoint.
      const globalSearch = document.getElementById('office-global-search');
      if (globalSearch) {
        globalSearch.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const q = globalSearch.value.trim();
            if (!q) return;
            if (typeof officeGoto === 'function') {
              officeGoto('bons', { pill: 'liste', q });
            } else {
              location.href = '/office/?view=bons&pill=liste&q=' + encodeURIComponent(q);
            }
            globalSearch.blur();
          } else if (e.key === 'Escape') {
            globalSearch.value = '';
            globalSearch.blur();
          }
        });
      }

      // ─── Drawer (shared across views) ────────────────────
      const drawer = new BonDrawer();

      function openDrawer(bonId, opts) {
        const url = new URL(window.location);
        url.searchParams.set('bon', bonId);
        history.pushState({}, '', url);
        drawer.load(bonId, opts);
        drawer.show();
      }
      // Eksponér globalt (samme mønster som window.openKunde360 / window.openBonOpretModal)
      // så views der ikke får openDrawer ind som opts — fx crm-inbox.js "Åbn bon →" og
      // drift.js — kan kalde window.openDrawer().
      window.openDrawer = openDrawer;

      // Sync URL når draweren faktisk lukker. Wrap _doHide (det reelle luk),
      // ikke hide() — hide() kan blive afbrudt af 3-vejs "ugemte ændringer"-dialogen,
      // og så skal ?bon ikke fjernes fra URL'en.
      const origDoHide = drawer._doHide.bind(drawer);
      drawer._doHide = function() {
        origDoHide();
        const url = new URL(window.location);
        if (url.searchParams.has('bon')) {
          url.searchParams.delete('bon');
          history.pushState({}, '', url);
        }
      };

      // ─── Modal ───────────────────────────────────────────
      const modal = new BonOpretModal({
        onCreated: (bonId) => { drawer.open(bonId, { justCreated: true }); }
      });
      // Global åbner for "Opret bon fra mail" i indbakken (prefill ignoreres af open() pt.)
      window.openBonOpretModal = (opts) => modal.open(opts);

      // ─── View switching ──────────────────────────────────
      const contentEl = document.getElementById('office-content');
      let _currentView = null;
      let _logPendingFocus = null;   // {date, highlightBon} sat af openLogistikForBon

      const views = {
        dashboard: {
          init: () => initOfficeDashboard(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupOfficeDashboard === 'function') cleanupOfficeDashboard(); },
        },
        bons: {
          init: () => initBonsList(contentEl, { openDrawer, openNewBon: () => modal.open() }),
          cleanup: () => {},
        },
        'web-orders': {
          init: () => initWebOrders(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupWebOrders === 'function') cleanupWebOrders(); },
        },
        'activity-log': {
          init: () => initActivityLog(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupActivityLog === 'function') cleanupActivityLog(); },
        },
        calendar: {
          init: () => initOfficeCalendar(contentEl, { openDrawer, openNewBon: () => modal.open() }),
          cleanup: () => { if (typeof cleanupOfficeCalendar === 'function') cleanupOfficeCalendar(); },
        },
        ugeoversigt: {
          init: () => initUgeoversigt(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupUgeoversigt === 'function') cleanupUgeoversigt(); },

          init: () => initCrmDashboard(contentEl, { openDrawer, openKunde360 }),

        },
        // ─── Indkøb (Fase 2 — genbrug shared/indkob.js + indkob_settings.js) ──
        'indkob-liste': {
          init: () => {

          init: () => {
            if (typeof initIndkobSettings === 'function') initIndkobSettings(contentEl, { mode: 'page' });
            else contentEl.innerHTML = '<div style="padding:24px;color:#888">Indkøbsindstillinger ikke indlæst</div>';

        'indkob-forecast': {

          },
          cleanup: () => { if (typeof cleanupForecast === 'function') cleanupForecast(); },
        },
        // ─── Logistik (Spor 2 — Workflow B: leveringsoversigt) ────────────────
        logistik: {
          init: () => {
            const f = _logPendingFocus || {};
            _logPendingFocus = null;
            initLogistik(contentEl, Object.assign({ openDrawer }, f));
          },
          cleanup: () => { if (typeof cleanupLogistik === 'function') cleanupLogistik(); },
        },
        'logistik-historik': {

        },
        events: {

          cleanup: () => { if (typeof cleanupEvents === 'function') cleanupEvents(); },

      };

      // ──────────────────────────────────────────────────────────────────────
      // PILLS — sub-navigation per section (Fase 2)
      //
      // Tom array = ingen pills for sektionen (dashboard, tilbud, logistik
      // vises uden pills i toppen, men logistik har dem som dokumentation).

        dashboard: null,
        bons: [
          { id: 'liste', label: 'Liste', def: true },
          { id: 'kalender', label: 'Kalender' },
          { id: 'uge', label: 'Ugeoversigt' },
          { id: 'plan', label: 'Planlægning' },
          { id: 'nye', label: 'Ubekræftede', badge: 'bons_nye' },
          { id: 'log', label: 'Log' },
        ],
        crm: [
          { id: 'pipeline', label: 'Pipeline', def: true },
          { id: 'kontakter', label: 'Kontakter' },
          { id: 'outreach', label: 'Kampagner' },
          { id: 'indbakke', label: 'Indbakke', badge: 'crm_indbakke' },
          { id: 'prospekter', label: 'Prospekter' },
          { id: 'reakt', label: 'Re-aktivering' },
          { id: 'indsigt', label: 'Indsigt' },
          { id: 'import', label: 'Importér leads' },
          { id: 'verktoj', label: 'Værktøjer' },
        ],
        tilbud: null,
        logistik: [
          { id: 'oversigt', label: 'Oversigt', def: true },

        ],
        indkob: [
          { id: 'liste', label: 'Indkøbsliste', def: true },

          { id: 'post', label: 'Leverandørpost', badge: 'indkob_leverandorpost' },

        okonomi: [

          { id: 'penge', label: 'Pengestrøm' },
          { id: 'rap', label: 'Rapporter' },
        ],
        events: null,
      };

      // SECTION_VIEW_MAP — oversætter (sidebar-section, pill) → internt view-navn
      // Fase 3 erstatter dette med router-filer pr. sektion.
      const SECTION_VIEW_MAP = {
        dashboard: { _default: 'dashboard' },
        bons: {
          _default: 'bons',
          liste: 'bons',
          kalender: 'calendar',
          uge: 'ugeoversigt',
          plan: 'planning',
          nye: 'web-orders',
          log: 'activity-log',
        },

          _default: 'crm-dashboard',
          pipeline: 'crm-dashboard',
          kontakter: 'kontakter',
          outreach: 'crm-outreach',
          indbakke: 'crm-inbox',
          prospekter: 'crm-prospekter',
          reakt: 'crm-reaktivering',
          indsigt: 'crm-kundeindsigt',
          import: 'crm-leadimport',
          verktoj: 'crm-verktoj',
        },
        tilbud: { _default: 'tilbud' },
        logistik: {
          _default: 'logistik',
          oversigt: 'logistik',
          historik: 'logistik-historik',
        },
        indkob: {
          _default: 'indkob-liste',
          liste: 'indkob-liste',
          best: 'indkob-liste',
          forecast: 'indkob-forecast',
          lev: 'indkob-lev',
          post: 'leverandorpost',
        },
        okonomi: {
          _default: 'fakturering',
          fakt: 'fakturering',
          penge: 'cashflow',
          rap: 'rapporter',
        },
        opskrifter: { _default: 'opskrifter' },
        drift: { _default: 'drift' },
        co2: { _default: 'co2' },
        events: { _default: 'events' },
      };

      // Reverse-map: gammel-view-navn → ny (section, pill) for bagudkompat
      const REVERSE_MAP = {};
      Object.entries(SECTION_VIEW_MAP).forEach(([section, pills]) => {
        Object.entries(pills).forEach(([pill, view]) => {
          if (pill === '_default') return;
          if (!REVERSE_MAP[view]) REVERSE_MAP[view] = { section, pill };
        });
      });

      function getDefaultPill(section) {
        const pills = PILLS[section];
        if (!pills) return null;
        return pills.find(p => p.def)?.id || pills[0].id;
      }

      function resolvePill(section, requested) {
        const pills = PILLS[section];
        if (!pills) return null;
        if (requested && pills.some(p => p.id === requested)) return requested;
        return getDefaultPill(section);
      }

      function renderPills(section, activePill) {
        const pillsEl = document.getElementById('office-pills');
        const pills = PILLS[section];
        if (!pills || pills.length === 0) {
          pillsEl.style.display = 'none';
          pillsEl.innerHTML = '';
          return;
        }
        pillsEl.style.display = '';
        pillsEl.innerHTML = pills.map(p => `
          <button class="pill ${p.id === activePill ? 'active' : ''}" data-pill="${p.id}">
            ${p.label}
            ${p.badge ? `<span class="pill-badge" data-badge="${p.badge}" style="display:none"></span>` : ''}
          </button>
        `).join('');
        pillsEl.querySelectorAll('.pill').forEach(btn => {
          btn.addEventListener('click', () => switchSection(section, btn.dataset.pill));
        });
        renderBadges();
      }

      // Hjælpefunktion: bind sidebar-klik via section-navn (bons, crm, ...)
      // Internt oversætter den til (internal view, pill) via SECTION_VIEW_MAP.
      let _currentSection = null;
      let _currentPill = null;
      function switchSection(section, requestedPill) {
        const map = SECTION_VIEW_MAP[section];
        if (!map) { console.warn('Ukendt section:', section); return; }
        const pill = resolvePill(section, requestedPill);
        const viewKey = (pill && map[pill]) || map._default;
        _currentSection = section;
        _currentPill = pill;
        // Markér aktiv sidebar-item baseret på section
        document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === section);
        });
        // Render pills + URL-sync
        renderPills(section, pill);
        const url = new URL(window.location);
        url.searchParams.set('view', section);
        if (pill) url.searchParams.set('pill', pill); else url.searchParams.delete('pill');
        history.pushState({}, '', url);
        // Skift internt view (gamle switchView håndterer cleanup)
        switchView(viewKey);
      }
      window.switchSection = switchSection;

      // pushState bruges når brugeren navigerer mellem views, så browserens
      // tilbage-knap (eller swipe-gesture) bringer dem tilbage til forrige
      // view. switchView() bruger fortsat replaceState når URL'en kun
      // synkroniseres uden et reelt nav-skifte.
      function openKunde360(customerId) {
        const url = new URL(window.location);
        url.searchParams.set('view', 'kontakter');
        url.searchParams.set('tab', 'personer');
        url.searchParams.set('customer', customerId);
        url.searchParams.delete('company');
        url.searchParams.delete('ftab');
        history.pushState({}, '', url);
        // Force re-init: switchView returnerer ellers tidligt hvis vi
        // allerede er på 'kontakter'-viewet (fx fordi Firma 360° er åben).
        if (_currentView === 'kontakter') {
          if (views.kontakter?.cleanup) views.kontakter.cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
        }
        switchView('kontakter');
      }
      window.openKunde360 = openKunde360;

      // "Se i logistik" fra et bon-kort / bon-drawer — skifter til
      // logistik-viewet og fremhæver bonen.
      window.openLogistikForBon = function openLogistikForBon(bonId, date) {
        _logPendingFocus = { date: date || null, highlightBon: bonId };
        switchSection('logistik', 'oversigt');
      };

      // Generic deep-link helper — bruges fra dashboard m.fl.
      // Eksempler:
      //   officeGoto('bons', { filter: 'today' })
      //   officeGoto('bons', { filter: 'date', date: '2026-04-30' })
      //   officeGoto('fakturering')
      window.officeGoto = function officeGoto(viewName, params) {
        const url = new URL(window.location);
        url.searchParams.set('view', viewName);
        // Ryd irrelevante params fra forrige view
        ['filter', 'date', 'q', 'customer', 'bon', 'company', 'company_name'].forEach(k => url.searchParams.delete(k));
        if (params) {
          for (const [k, v] of Object.entries(params)) {
            if (v !== null && v !== undefined && v !== '') url.searchParams.set(k, v);
          }
        }
        history.pushState({}, '', url);
        if (_currentView === viewName) {
          // Re-init for at tage de nye params i brug
          if (views[viewName]?.cleanup) views[viewName].cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
          switchView(viewName);
        } else {
          switchView(viewName);
        }
      };

      window.switchView = function switchView(viewName) {
        // Backwards-compat: gamle bookmarks/links → sektion+pill
        if (viewName === 'kunder' || viewName === 'crm-kunde360') {
          viewName = 'kontakter';
          const url = new URL(window.location);
          if (!url.searchParams.has('tab')) url.searchParams.set('tab', 'personer');
          history.replaceState({}, '', url);
        }
        if (_currentView === viewName) return;

        // Cleanup previous
        if (_currentView && views[_currentView]?.cleanup) {
          views[_currentView].cleanup();
        }

        // Clear content
        contentEl.innerHTML = '';
        _currentView = viewName;

        // Bevar _currentSection/_currentPill hvis switchSection lige har sat
        // dem korrekt (undgår URL-flicker når flere pills mapper til samme view,
        // fx indkob.liste + indkob.best → 'indkob-liste'). Ellers udled via
        // REVERSE_MAP for direkte switchView('tilbud')-kald m.fl.
        const expected = _currentSection && SECTION_VIEW_MAP[_currentSection]
          ? (SECTION_VIEW_MAP[_currentSection][_currentPill] || SECTION_VIEW_MAP[_currentSection]._default)
          : null;
        if (expected !== viewName) {
          const meta = REVERSE_MAP[viewName] || { section: viewName, pill: null };
          _currentSection = meta.section;
          _currentPill = meta.pill || (PILLS[meta.section] ? getDefaultPill(meta.section) : null);
        }

        // Update sidebar active state — baseret på section, ikke internt view
        document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === _currentSection);
        });

        // Update pills-row (skjuler sig selv hvis sektionen ikke har pills)
        renderPills(_currentSection, _currentPill);

        // Update URL — bevar drawer-param hvis sat
        const url = new URL(window.location);
        url.searchParams.set('view', _currentSection);
        if (_currentPill) url.searchParams.set('pill', _currentPill);
        else url.searchParams.delete('pill');
        if (!url.searchParams.has('bon')) {
          history.replaceState({}, '', url);
        }

        // Update help system page context
        var helpNames = {
          'dashboard':'Office — Dashboard', 'bons-list':'Office — Bonliste',
          'planning':'Office — Planlægning', 'calendar':'Office — Kalender',
          'crm-dashboard':'Office — CRM', 'crm-kunde360':'Office — Kunder',
          'kontakter':'Office — Kontakter',
          'crm-inbox':'Office — CRM Indbakke', 'fakturering':'Office — Fakturering',
          'tilbud':'Office — Tilbud', 'ugeoversigt':'Office — Ugeoversigt',
          'cashflow':'Office — Pengestrøm',
          'crm-kundeindsigt':'Office — Kundeindsigt',
          'crm-reaktivering':'Office — Re-aktivering',
          'crm-prospekter':'Office — Prospekter'
        };
        if (typeof HelpSystem !== 'undefined') {
          HelpSystem.setPage('office-' + viewName, helpNames[viewName] || 'Office — ' + viewName);
        }

        // Init view
        views[viewName]?.init();
      }

      // ─── Sidebar click handlers ─────────────────────────
      // Klik på sidebar-section bruger den nye switchSection (med pills).
      // Hvis data-view ikke matcher en kendt section, falder vi tilbage til
      // gamle switchView (kompatibilitet for fremtidige eksterne kald).
      document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          const v = btn.dataset.view;
          if (SECTION_VIEW_MAP[v]) {
            switchSection(v);  // ny model: section → default pill
          } else {
            switchView(v);     // legacy fallback
          }
          closeSidebar();      // luk drawer efter nav på smalle skærme
        });
      });

      // ─── Sidebar hamburger-toggle (smal viewport) ────────
      const _sidebar = document.querySelector('.office-sidebar');
      const _sbBackdrop = document.getElementById('office-sidebar-backdrop');
      const _sbToggle = document.getElementById('office-sidebar-toggle');
      function openSidebar() {
        if (_sidebar) _sidebar.classList.add('open');
        if (_sbBackdrop) _sbBackdrop.classList.add('open');
      }
      function closeSidebar() {
        if (_sidebar) _sidebar.classList.remove('open');
        if (_sbBackdrop) _sbBackdrop.classList.remove('open');
      }
      if (_sbToggle) _sbToggle.addEventListener('click', openSidebar);
      if (_sbBackdrop) _sbBackdrop.addEventListener('click', closeSidebar);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && _sidebar && _sidebar.classList.contains('open')) closeSidebar();
      });

      // ─── Badges (Fase 6: SSE-debounced live-opdatering) ────
      // Erstatter de tidligere separate updateInvoiceBadge / updateWebOrdersBadge /
      // updateSiBadge-funktioner. Ét endpoint, ét cache, ét opdateringsevent.
      let _badgesCache = {};
      let _badgeReloadTimer = null;
      async function loadNavBadges() {
        try {
          const data = await apiFetch('/nav/badges');
          _badgesCache = data || {};
          renderBadges();
        } catch (e) { console.warn('[nav/badges]', e?.message || e); }
      }
      function renderBadges() {
        document.querySelectorAll('[data-badge]').forEach(el => {
          const key = el.dataset.badge;
          const val = _badgesCache[key] || 0;
          if (val > 0) {
            el.textContent = val > 999 ? '999+' : val;
            el.style.display = '';
          } else {
            el.style.display = 'none';
          }
        });
      }
      function scheduleBadgeReload() {
        if (_badgeReloadTimer) clearTimeout(_badgeReloadTimer);
        _badgeReloadTimer = setTimeout(loadNavBadges, 300);
      }
      window.loadNavBadges = loadNavBadges;
      window.scheduleBadgeReload = scheduleBadgeReload;
      loadNavBadges();

      // ─── Fælles "Nyt der kræver handling"-indikator i topbaren ───
      // Samler nye web-bestillinger + mail der kan blive en ordre, så de to
      // ting man ikke må overse altid har ét synligt sted — uanset view.
      // Tæller = bons_nye + crm_indbakke (samme tal som sidebar-badges).
      let _attnData = { web_orders: [], mail: [], counts: { web: 0, mail: 0, total: 0 } };
      let _attnReloadTimer = null;
      let _attnAutoChecked = false;
      const _attnWrap  = document.getElementById('attn-wrap');
      const _attnBtn   = document.getElementById('attn-btn');
      const _attnPanel = document.getElementById('attn-panel');
      const _attnCount = document.getElementById('attn-count');

      function _attnMeta(w) {
        const parts = [];
        if (w.delivery_date) {
          try { parts.push(formatDanishDate(w.delivery_date)); } catch (e) { parts.push(w.delivery_date); }
        }
        if (w.total_units > 0) parts.push(w.total_units + ' enh.');
        else if (w.pax > 0)    parts.push(w.pax + ' pax');
        return parts.join(' · ');
      }

      function renderAttention() {
        const total = (_attnData.counts && _attnData.counts.total) || 0;
        if (_attnCount) {
          _attnCount.textContent = total > 99 ? '99+' : total;
          _attnCount.style.display = total > 0 ? 'inline-flex' : 'none';
        }
        if (_attnBtn) _attnBtn.classList.toggle('has-new', total > 0);
        if (!_attnPanel) return;

        const web  = _attnData.web_orders || [];
        const mail = _attnData.mail || [];
        let html = '<div class="office-attn-head"><span>Nyt der kræver handling</span></div>';

        if (total === 0) {
          html += '<div class="office-attn-empty">✓ Alt er set — intet venter</div>';
        } else {
          html += '<div class="office-attn-grp">🛒 Nye web-bestillinger (' + web.length + ')</div>';
          web.forEach(function(w) {
            const who = w.customer_name || w.company_name || 'Ukendt';
            const subParts = [];
            if (w.company_name && w.company_name !== who) subParts.push(w.company_name);
            const meta = _attnMeta(w);
            if (meta) subParts.push(meta);
            html += '<div class="office-attn-row web" data-bon="' + w.bon_id + '">'
              + '<div class="ar-main"><div class="ar-title">#' + esc(String(w.bon_number || w.bon_id)) + ' · ' + esc(who) + '</div>'
              + '<div class="ar-sub">' + esc(subParts.join(' · ')) + '</div></div>'
              + '<button class="office-attn-ack" data-ack="' + w.bon_id + '">Bekræft</button></div>';
          });

          html += '<div class="office-attn-grp sep">✉ Mail der kan blive en ordre (' + mail.length + ')</div>';
          mail.forEach(function(m) {
            const isUf = m.kind === 'unmatched';
            html += '<div class="office-attn-row mail" data-mail-kind="' + m.kind + '"' + (m.bon_id ? ' data-mail-bon="' + m.bon_id + '"' : '') + '>'
              + '<div class="ar-main"><div class="ar-title">' + esc(m.subject || '(uden emne)') + '</div>'
              + '<div class="ar-sub">' + esc(m.from || '') + '</div></div>'
              + '<span class="office-attn-tag ' + (isUf ? 'uf' : 'kc') + '">' + (isUf ? 'Ufordelt' : 'Kendt kunde') + '</span></div>';
          });
        }

        _attnPanel.innerHTML = html;

        _attnPanel.querySelectorAll('.office-attn-row.web').forEach(function(row) {
          row.addEventListener('click', function() {
            closeAttention();
            if (typeof openDrawer === 'function') openDrawer(row.dataset.bon);
          });
        });
        _attnPanel.querySelectorAll('[data-ack]').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = btn.dataset.ack;
            acknowledgeBon(id).catch(function(){ /* SSE retter alligevel op */ });
            _attnData.web_orders = (_attnData.web_orders || []).filter(function(w){ return String(w.bon_id) !== String(id); });
            _attnData.counts.web = _attnData.web_orders.length;
            _attnData.counts.total = _attnData.counts.web + (_attnData.mail || []).length;
            renderAttention();
            scheduleBadgeReload();
          });
        });
        _attnPanel.querySelectorAll('.office-attn-row.mail').forEach(function(row) {
          row.addEventListener('click', function() {
            closeAttention();
            switchSection('crm', 'indbakke');
          });
        });
      }

      function openAttention() {
        if (!_attnPanel) return;
        _attnPanel.style.display = 'block';
        if (_attnBtn) _attnBtn.classList.remove('pulse');
      }
      function closeAttention() {
        if (_attnPanel) _attnPanel.style.display = 'none';
      }
      function toggleAttention() {
        if (!_attnPanel) return;
        if (_attnPanel.style.display === 'block') closeAttention(); else openAttention();
      }

      async function loadAttention() {
        try {
          const data = await fetchNavAttention();
          _attnData = data || { web_orders: [], mail: [], counts: { web: 0, mail: 0, total: 0 } };
          renderAttention();
          // Auto-åbn + pulse én gang pr. login hvis der er noget at se.
          if (!_attnAutoChecked) {
            _attnAutoChecked = true;
            const total = (_attnData.counts && _attnData.counts.total) || 0;
            if (total > 0 && !sessionStorage.getItem('attn_login_seen')) {
              sessionStorage.setItem('attn_login_seen', '1');
              openAttention();
              if (_attnBtn) { _attnBtn.classList.add('pulse'); }
            }
          }
        } catch (e) { console.warn('[nav/attention]', e && e.message ? e.message : e); }
      }
      function scheduleAttentionReload() {
        if (_attnReloadTimer) clearTimeout(_attnReloadTimer);
        _attnReloadTimer = setTimeout(loadAttention, 300);
      }

      // Samlet, klikbar live-toast (erstatter web-order + mail-toasts i office).
      function _showAttentionToast(msg) {
        const existing = document.querySelector('.web-order-toast');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.className = 'web-order-toast';
        t.textContent = msg;
        t.onclick = function() { openAttention(); t.remove(); };
        document.body.appendChild(t);
        setTimeout(function(){ if (t.parentNode) t.remove(); }, 12000);
      }

      if (_attnBtn) _attnBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleAttention(); });
      document.addEventListener('click', function(e) {
        if (_attnWrap && !_attnWrap.contains(e.target) && _attnPanel && _attnPanel.style.display === 'block') closeAttention();
      });
      window.loadAttention = loadAttention;
      window.scheduleAttentionReload = scheduleAttentionReload;
      loadAttention();

      // ─── Initial view fra URL ──────────────────────────
      // Parser ?view=<section>&pill=<pill>. Hvis view er en kendt section,
      // bruger vi switchSection (giver default-pill hvis pill mangler).
      // Ellers er det et gammelt view-navn — fallback til switchView.
      const params = new URLSearchParams(window.location.search);
      const initialView = params.get('view') || 'dashboard';
      const initialPill = params.get('pill') || null;
      if (SECTION_VIEW_MAP[initialView]) {
        switchSection(initialView, initialPill);
      } else if (views[initialView]) {
        switchView(initialView);
      } else {
        switchSection('dashboard');
      }

      // Open drawer from URL
      const bonIdFromUrl = params.get('bon');
      if (bonIdFromUrl) openDrawer(bonIdFromUrl);

      // ─── Popstate ────────────────────────────────────────
      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        const v = p.get('view') || 'dashboard';
        const pill = p.get('pill') || null;
        // Hvis section/pill ændrer sig, naviger via switchSection
        if (SECTION_VIEW_MAP[v]) {
          if (v !== _currentSection || pill !== _currentPill) {
            switchSection(v, pill);
          } else if (views[_currentView]) {
            // Samme section+pill men andre params (fx customer/tab på kontakter).
            // Force re-init så de nye params tages i brug.
            if (views[_currentView].cleanup) views[_currentView].cleanup();
            contentEl.innerHTML = '';
            const viewKey = _currentView; _currentView = null;
            switchView(viewKey);
          }
        } else if (v !== _currentView) {
          switchView(v);
        } else if (views[v]) {
          if (views[v].cleanup) views[v].cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
          switchView(v);
        }

        const bonId = p.get('bon');
        if (bonId) {
          drawer.load(bonId);
          drawer.show();
        } else {
          drawer.el.classList.remove('open');
          drawer.overlayEl.classList.remove('open');
          document.body.style.overflow = '';
          drawer.dirty = false;
        }
      });

      // ─── SSE (always active) ─────────────────────────────
      connectSSE('/api/sse', {
        bon_created: (data) => {
          if (typeof _blHandleBonCreated === 'function') _blHandleBonCreated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_created', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_created', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_created', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_created', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_created', data);
          if (typeof _woHandleSSE === 'function') _woHandleSSE('bon_created', data);
          if (typeof _alHandleSSE === 'function') _alHandleSSE('bon_created', data);
          if (typeof _evHandleSSE === 'function') _evHandleSSE('bon_created', data);
          if (data && data.source === 'web_order') {
            _showAttentionToast('🛒 Ny web-bestilling: #' + (data.bon_number || data.id) + ' — klik for at åbne');
          }
          scheduleBadgeReload();       // bons_nye + tilbud_aktive + okonomi_fakturering kan ændre sig
          scheduleAttentionReload();   // ny bon → opdater topbar-indikatoren
        },
        bon_updated: (data) => {
          if (typeof _blHandleBonUpdated === 'function') _blHandleBonUpdated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_updated', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_updated', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_updated', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_updated', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_updated', data);
          if (typeof _woHandleSSE === 'function') _woHandleSSE('bon_updated', data);
          if (typeof _logHandleSSE === 'function') _logHandleSSE('bon_updated', data);
          if (typeof _evHandleSSE === 'function') _evHandleSSE('bon_updated', data);
          scheduleBadgeReload();  // acknowledge-flag på bons_nye kan ændre sig
          scheduleAttentionReload();
        },
        bon_status: (data) => {
          if (typeof _blHandleBonStatus === 'function') _blHandleBonStatus(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_status', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_status', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_status', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_status', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_status', data);
          if (typeof _woHandleSSE === 'function') _woHandleSSE('bon_status', data);
          if (typeof _alHandleSSE === 'function') _alHandleSSE('bon_status', data);
          if (typeof _evHandleSSE === 'function') _evHandleSSE('bon_status', data);
          scheduleBadgeReload();  // LEVERET → fakturering-køen
          scheduleAttentionReload();
        },
        bon_deleted: (data) => {
          // Permanent sletning — view-handlers filtrerer på event-navn, så vi
          // genbruger 'bon_status'-stien (effekten er den samme: re-fetch liste).
          if (typeof _blHandleBonStatus === 'function') _blHandleBonStatus(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_status', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_status', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_status', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_status', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_status', data);
          if (typeof _woHandleSSE === 'function') _woHandleSSE('bon_status', data);
          if (typeof _evHandleSSE === 'function') _evHandleSSE('bon_status', data);
          scheduleBadgeReload();
          scheduleAttentionReload();
        },
        event_updated: (data) => {
          if (typeof _evHandleSSE === 'function') _evHandleSSE('event_updated', data);
        },
        crm_activity_created: (data) => {
          if (typeof _crmDashHandleSSE === 'function') _crmDashHandleSSE('crm_activity_created', data);
          if (typeof _k3HandleSSE === 'function') _k3HandleSSE('crm_activity_created', data);
          if (typeof _reakHandleSSE === 'function') _reakHandleSSE('crm_activity_created', data);
        },
        crm_stage_changed: (data) => {
          if (typeof _k3HandleSSE === 'function') _k3HandleSSE('crm_stage_changed', data);
          if (typeof _prosHandleSSE === 'function') _prosHandleSSE('crm_stage_changed', data);
        },
        crm_consent_updated: (data) => {
          if (typeof _k3HandleSSE === 'function') _k3HandleSSE('crm_consent_updated', data);
        },
        // Outreach-kampagner (Fase 4): pipeline-board lytter på alle member-events
        // + selve kampagnernes lifecycle.
        campaign_created:        (data) => { if (typeof _coHandleSSE === 'function') _coHandleSSE('campaign_created', data); },
        campaign_updated:        (data) => { if (typeof _coHandleSSE === 'function') _coHandleSSE('campaign_updated', data); },
        campaign_members_added:  (data) => { if (typeof _coHandleSSE === 'function') _coHandleSSE('campaign_members_added', data); },
        campaign_member_updated: (data) => { if (typeof _coHandleSSE === 'function') _coHandleSSE('campaign_member_updated', data); },
        campaign_member_removed: (data) => { if (typeof _coHandleSSE === 'function') _coHandleSSE('campaign_member_removed', data); },
        rfm_computed: (data) => {
          if (typeof _kiHandleSSE === 'function') _kiHandleSSE('rfm_computed', data);
          if (typeof _reakHandleSSE === 'function') _reakHandleSSE('rfm_computed', data);
          if (typeof _prosHandleSSE === 'function') _prosHandleSSE('rfm_computed', data);
        },
        rfm_config_changed: (data) => {
          if (typeof _kiHandleSSE === 'function') _kiHandleSSE('rfm_config_changed', data);
        },
        mail_received: (data) => {
          // Indgående mail på en bon/tråd. connectSSE() viser allerede en toast +
          // opdaterer bon-kort globalt; her opdaterer vi office-specifikt:
          // bons-listen (✉-badge på rækken), den samlede mail-indbakke + tælleren.
          if (typeof _blHandleMailReceived === 'function') _blHandleMailReceived(data);
          if (typeof _inbHandleSSE === 'function') _inbHandleSSE('mail_received', data);
          _showAttentionToast('✉ Ny mail — klik for at se');
          scheduleBadgeReload();  // bons_ulaest_mail
          scheduleAttentionReload();
        },
        mail_unmatched: (data) => {
          if (typeof _inbHandleSSE === 'function') _inbHandleSSE('mail_unmatched', data);
          _showAttentionToast('✉ Ny ufordelt mail — kan blive en ordre');
          scheduleBadgeReload();  // crm_indbakke
          scheduleAttentionReload();
        },
        mail_read: (data) => {
          // En tråd-mail er markeret læst (her eller et andet sted) → fjern fra
          // den samlede indbakke + genberegn badges.
          if (typeof _inbHandleSSE === 'function') _inbHandleSSE('mail_read', data);
          scheduleBadgeReload();
          scheduleAttentionReload();
        },
        mail_thread_updated: (data) => {
          // Indbakke-tråd skiftede handling_status/snooze (her eller et andet sted).
          if (typeof _inbHandleSSE === 'function') _inbHandleSSE('mail_thread_updated', data);
          scheduleBadgeReload();
          scheduleAttentionReload();
        },
        // quote_created / quote_updated fjernet i Patch I (maj 2026).
        // Backend sender bon_*-events også for tilbud (jf. Patch F). _tilbudHandleSSE
        // er nu wired ind i bon_created/bon_updated-handlerne ovenfor.
        po_mail_received: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_received', data);
          scheduleBadgeReload();  // indkob_leverandorpost
        },
        po_mail_sent: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_sent', data);
          scheduleBadgeReload();  // unread → read kan trigger genberegning
        },
        supplier_mail_received: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_received', data);
          scheduleBadgeReload();  // indkob_leverandorpost
        },
        supplier_mail_sent: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_sent', data);
          scheduleBadgeReload();
        },
        item_price_updated: (data) => {
          if (typeof _opsHandleSSE === 'function') _opsHandleSSE('item_price_updated', data);
        },
        recipe_costs_refreshed: (data) => {
          if (typeof _opsHandleSSE === 'function') _opsHandleSSE('recipe_costs_refreshed', data);
        },
        recipe_targets_updated: (data) => {
          if (typeof _opsHandleSSE === 'function') _opsHandleSSE('recipe_targets_updated', data);
        },
        delivery_route_stop_added: (data) => {
          if (typeof _logHandleSSE === 'function') _logHandleSSE('delivery_route_stop_added', data);
        },
        delivery_route_stop_removed: (data) => {
          if (typeof _logHandleSSE === 'function') _logHandleSSE('delivery_route_stop_removed', data);
        },
        delivery_route_status_changed: (data) => {
          if (typeof _logHandleSSE === 'function') _logHandleSSE('delivery_route_status_changed', data);
        },
        delivery_stop_status_changed: (data) => {
          if (typeof _logHandleSSE === 'function') _logHandleSSE('delivery_stop_status_changed', data);
        },
        delivery_incident_logged: (data) => {
          if (typeof _logHandleSSE === 'function') _logHandleSSE('delivery_incident_logged', data);
        },
      }, { suppressMailToast: true });
    })();
  </script>
  <script src="/shared/help-system.js"></script>
</body>
</html>
