  <style>
    /* ── Shell layout ───────────────────────────────────────── */
    .office-shell {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }
    .office-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-m, 16px) var(--space-l, 24px);
      border-bottom: 1px solid var(--color-border, #d7d1ca);
      background: var(--color-surface, #fff);
      flex-shrink: 0;
    }
    .office-topbar h1 {
      font-family: var(--font-heading, 'Playfair Display', Georgia, serif);
      font-size: var(--font-size-l, 18px);
      margin: 0;
      font-weight: 700;
    }
    .office-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    .office-sidebar {
      width: 210px;
      flex-shrink: 0;
      background: #6B4C2A;
      display: flex;
      flex-direction: column;
      padding: 0;
      color: rgba(255,255,255,0.78);
      font-family: var(--font-body, 'DM Sans', system-ui, sans-serif);
    }
    .sidebar-brand {
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-brand-name {
      font-family: var(--font-heading, 'Playfair Display', Georgia, serif);
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      line-height: 1.2;
    }
    .sidebar-brand-sub {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #C8962A;
      margin-top: 2px;
    }
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 8px 8px;
      overflow-y: auto;
    }
    .sidebar-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(255,255,255,0.35);
      padding: 14px 12px 5px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: rgba(255,255,255,0.72);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      width: 100%;
      text-align: left;
      transition: background 0.12s, color 0.12s;
      position: relative;
    }
    .sidebar-link:hover {
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.97);
    }
    .sidebar-link.active {
      background: rgba(255,255,255,0.13);
      color: #F1E6B2;
      font-weight: 700;
      border-left: 3px solid #C8962A;
      padding-left: 9px;
    }
    .sidebar-link.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    .sidebar-link .sidebar-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }
    .sidebar-badge {
      margin-left: auto;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #C94040;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .sidebar-badge.gold { background: #C8962A; }
    .sidebar-bottom {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }
    .sidebar-user-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #C8962A 0%, #8e631f 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
    }
    .sidebar-user-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .sidebar-user-role { font-size: 10px; color: rgba(255,255,255,0.45); }

    /* ── Content ────────────────────────────────────────────── */
    #office-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-l, 24px);
    }

    /* ── Bons List ─────────────────────────────────────────── */

    .bl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-search-wrap { flex: 1; min-width: 200px; }
    .bl-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--color-surface, #fff);
    }
    .bl-search:focus { outline: 2px solid var(--brand-primary, #8e631f); outline-offset: -1px; }
    .bl-toolbar-right { display: flex; align-items: center; gap: 8px; }
    .bl-ny-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-ny-btn:hover { filter: brightness(1.1); }

    /* Column chooser */
    .bl-col-chooser { position: relative; }
    .bl-col-btn {
      padding: 8px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-col-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-col-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 8px;
      z-index: 100;
      min-width: 180px;
    }
    .bl-col-dropdown.open { display: block; }
    .bl-col-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .bl-col-item:hover { background: var(--color-background, #f5f4f2); }

    /* Filters */
    .bl-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 20px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .bl-filter-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-filter-btn.active {
      background: var(--brand-primary, #8e631f);
      color: #fff;
      border-color: var(--brand-primary, #8e631f);
    }
    .bl-date-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }
    .bl-date-wrap label { color: var(--color-text-dim, #888); white-space: nowrap; }
    .bl-date-input {
      padding: 5px 8px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    /* Summary */
    .bl-summary {
      padding: 10px 16px;
      background: var(--brand-primary-light, #f1e6b2);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-primary, #8e631f);
      margin-bottom: 12px;
    }

    /* Table */
    .bl-table-wrap { overflow-x: auto; }
    .bl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .bl-th {
      padding: 8px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--color-text-dim, #888);
      border-bottom: 2px solid var(--color-border, #d7d1ca);
      white-space: nowrap;
      user-select: none;
    }
    .bl-th.bl-sortable { cursor: pointer; }
    .bl-th.bl-sortable:hover { color: var(--brand-primary, #8e631f); }
    .bl-th.bl-sorted::after {
      content: ' \25B2';
      font-size: 10px;
    }
    .bl-th.bl-sorted.desc::after {
      content: ' \25BC';
    }

    /* Rows */
    .bl-row { cursor: pointer; }
    .bl-row-main td {
      padding: 10px 12px 2px;
      border-top: 1px solid var(--color-border, #d7d1ca);
    }
    .bl-row-sub td {
      padding: 0 12px 8px;
      font-size: 13px;
    }
    .bl-row-main:first-child td { border-top: none; }
    .bl-row:hover td { background: var(--color-background, #f5f4f2); }
    .bl-row-main:hover + .bl-row-sub td { background: var(--color-background, #f5f4f2); }

    /* Production */
    .bl-production { border-left: 3px solid #3a7bd5; }
    .bl-prod-icon { font-size: 12px; }

    /* Cells */
    .bl-td-bon { font-weight: 700; white-space: nowrap; vertical-align: top; }
    .bl-bon-number { font-variant-numeric: tabular-nums; }
    .bl-td-date { white-space: nowrap; }
    .bl-td-date.bl-today { font-weight: 600; color: var(--brand-primary, #8e631f); }
    .bl-td-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .bl-td-status { vertical-align: top; white-space: nowrap; }
    .bl-td-num { text-align: right; font-variant-numeric: tabular-nums; }
    .bl-td-dim { color: var(--color-text-dim, #888); }
    .bl-td-opt { white-space: nowrap; }

    /* Status badge */
    .bl-status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    /* Mail */
    .bl-mail-icon {
      color: #d4781a;
      font-size: 13px;
      margin-left: 4px;
    }
    .bl-mail-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #d4781a;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    /* Staff badge */
    .bl-staff-badge {
      display: inline-block;
      margin-left: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: default;
      vertical-align: middle;
    }

    /* Empty state */
    .bl-empty {
      text-align: center;
      padding: 40px 12px;
      color: var(--color-text-dim, #888);
      font-size: 15px;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .office-sidebar { display: none !important; }
      #office-content { padding: var(--space-s, 8px); }
      .bl-toolbar { flex-direction: column; }
      .bl-search-wrap { width: 100%; }
      .bl-filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
      .bl-row-sub { display: none; }
      .bl-td-bon { font-size: 13px; }
      .bl-th, .bl-row-main td { padding: 6px 8px 2px; }
    }
  </style>
</head>

  <script>
    (async () => {
      const currentUser = await checkAuth();
      if (!currentUser) return;

      // ─── Sidebar user ──────────────────────────────────────
      const userEl = document.getElementById('sidebar-user');
      if (userEl && currentUser) {
        const name = currentUser.name || currentUser.email || '';
        const init = name.charAt(0).toUpperCase();
        const role = currentUser.role === 'admin' ? 'Administrator' : currentUser.role === 'office' ? 'Kontor' : currentUser.role === 'kitchen' ? 'Køkken' : currentUser.role || '';
        userEl.innerHTML = `
          <div class="sidebar-user-av">${init}</div>
          <div><div class="sidebar-user-name">${name}</div><div class="sidebar-user-role">${role}</div></div>
        `;
      }

      // ─── Zone switcher ──────────────────────────────────
      renderZoneSwitcher('office', currentUser.role, document.querySelector('.sidebar-bottom'), { style: 'sidebar' });

      // ─── Logout ──────────────────────────────────────────
      document.getElementById('sidebar-logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/login.html';
      });

      // ─── Drawer (shared across views) ────────────────────
      const drawer = new BonDrawer();

      function openDrawer(bonId) {
        const url = new URL(window.location);
        url.searchParams.set('bon', bonId);
        history.pushState({}, '', url);
        drawer.load(bonId);
        drawer.show();
      }

      // Override drawer hide to sync URL
      const origHide = drawer.hide.bind(drawer);
      drawer.hide = function() {
        origHide();
        const url = new URL(window.location);
        if (url.searchParams.has('bon')) {
          url.searchParams.delete('bon');
          history.pushState({}, '', url);
        }
      };

      // ─── Modal ───────────────────────────────────────────
      const modal = new BonOpretModal({
        onCreated: (bonId) => { drawer.open(bonId, { justCreated: true }); }
      });

      // ─── View switching ──────────────────────────────────
      const contentEl = document.getElementById('office-content');
      let _currentView = null;

      const views = {
        dashboard: {
          init: () => initOfficeDashboard(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupOfficeDashboard === 'function') cleanupOfficeDashboard(); },
        },
        bons: {
          init: () => initBonsList(contentEl, { openDrawer, openNewBon: () => modal.open() }),
          cleanup: () => {},
        },
        calendar: {
          init: () => initOfficeCalendar(contentEl, { openDrawer, openNewBon: () => modal.open() }),
          cleanup: () => { if (typeof cleanupOfficeCalendar === 'function') cleanupOfficeCalendar(); },
        },
        ugeoversigt: {
          init: () => initUgeoversigt(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupUgeoversigt === 'function') cleanupUgeoversigt(); },
        },
        planning: {
          init: () => initOfficePlanning(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupOfficePlanning === 'function') cleanupOfficePlanning(); },
        },
        'crm-dashboard': {
          init: () => initCrmDashboard(contentEl, { openDrawer, openKunde360 }),
          cleanup: () => { if (typeof cleanupCrmDashboard === 'function') cleanupCrmDashboard(); },
        },
        'crm-kunde360': {
          init: () => initCrmKunde360(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupCrmKunde360 === 'function') cleanupCrmKunde360(); },
        },
        kontakter: {
          init: () => initKontakter(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupKontakter === 'function') cleanupKontakter(); },
        },
        'crm-inbox': {
          init: () => initCrmInbox(contentEl, {}),
          cleanup: () => { if (typeof cleanupCrmInbox === 'function') cleanupCrmInbox(); },
        },
        'crm-kundeindsigt': {
          init: () => initCrmKundeindsigt(contentEl),
          cleanup: () => { if (typeof cleanupCrmKundeindsigt === 'function') cleanupCrmKundeindsigt(); },
        },
        'crm-reaktivering': {
          init: () => initCrmReaktivering(contentEl),
          cleanup: () => { if (typeof cleanupCrmReaktivering === 'function') cleanupCrmReaktivering(); },
        },
        'crm-prospekter': {
          init: () => initCrmProspekter(contentEl),
          cleanup: () => { if (typeof cleanupCrmProspekter === 'function') cleanupCrmProspekter(); },
        },
        fakturering: {
          init: () => initFakturering(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupFakturering === 'function') cleanupFakturering(); },
        },
        tilbud: {
          init: () => {
            const p = new URLSearchParams(window.location.search);
            initTilbud(contentEl, { openDrawer, customer_id: p.get('customer') ? parseInt(p.get('customer')) : null, id: p.get('quote') ? parseInt(p.get('quote')) : null });
          },
          cleanup: () => { if (typeof cleanupTilbud === 'function') cleanupTilbud(); },
        },
        rapporter: {
          init: () => initRapporter(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupRapporter === 'function') cleanupRapporter(); },
        },
        leverandorpost: {
          init: () => initSupplierInbox(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupSupplierInbox === 'function') cleanupSupplierInbox(); },
        },
        cashflow: {
          init: () => initCashflow(contentEl),
          cleanup: () => { if (typeof cleanupCashflow === 'function') cleanupCashflow(); },
        },
      };

      // pushState bruges når brugeren navigerer mellem views, så browserens
      // tilbage-knap (eller swipe-gesture) bringer dem tilbage til forrige
      // view. switchView() bruger fortsat replaceState når URL'en kun
      // synkroniseres uden et reelt nav-skifte.
      function openKunde360(customerId) {
        const url = new URL(window.location);
        url.searchParams.set('view', 'kontakter');
        url.searchParams.set('tab', 'personer');
        url.searchParams.set('customer', customerId);
        url.searchParams.delete('company');
        url.searchParams.delete('ftab');
        history.pushState({}, '', url);
        // Force re-init: switchView returnerer ellers tidligt hvis vi
        // allerede er på 'kontakter'-viewet (fx fordi Firma 360° er åben).
        if (_currentView === 'kontakter') {
          if (views.kontakter?.cleanup) views.kontakter.cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
        }
        switchView('kontakter');
      }
      window.openKunde360 = openKunde360;

      // Generic deep-link helper — bruges fra dashboard m.fl.
      // Eksempler:
      //   officeGoto('bons', { filter: 'today' })
      //   officeGoto('bons', { filter: 'date', date: '2026-04-30' })
      //   officeGoto('fakturering')
      window.officeGoto = function officeGoto(viewName, params) {
        const url = new URL(window.location);
        url.searchParams.set('view', viewName);
        // Ryd irrelevante params fra forrige view
        ['filter', 'date', 'q', 'customer', 'bon', 'company', 'company_name'].forEach(k => url.searchParams.delete(k));
        if (params) {
          for (const [k, v] of Object.entries(params)) {
            if (v !== null && v !== undefined && v !== '') url.searchParams.set(k, v);
          }
        }
        history.pushState({}, '', url);
        if (_currentView === viewName) {
          // Re-init for at tage de nye params i brug
          if (views[viewName]?.cleanup) views[viewName].cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
          switchView(viewName);
        } else {
          switchView(viewName);
        }
      };

      window.switchView = function switchView(viewName) {
        // Backwards-compat: gamle bookmarks/links
        if (viewName === 'kunder' || viewName === 'crm-kunde360') {
          viewName = 'kontakter';
          const url = new URL(window.location);
          url.searchParams.set('view', 'kontakter');
          if (!url.searchParams.has('tab')) url.searchParams.set('tab', 'personer');
          history.replaceState({}, '', url);
        }
        if (_currentView === viewName) return;

        // Cleanup previous
        if (_currentView && views[_currentView]?.cleanup) {
          views[_currentView].cleanup();
        }

        // Clear content
        contentEl.innerHTML = '';
        _currentView = viewName;

        // Update sidebar active state
        document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === viewName);
        });

        // Update URL
        const url = new URL(window.location);
        url.searchParams.set('view', viewName);
        if (!url.searchParams.has('bon')) {
          history.replaceState({}, '', url);
        }

        // Update help system page context
        var helpNames = {
          'dashboard':'Office — Dashboard', 'bons-list':'Office — Bonliste',
          'planning':'Office — Planlægning', 'calendar':'Office — Kalender',
          'crm-dashboard':'Office — CRM', 'crm-kunde360':'Office — Kunder',
          'kontakter':'Office — Kontakter',
          'crm-inbox':'Office — CRM Indbakke', 'fakturering':'Office — Fakturering',
          'tilbud':'Office — Tilbud', 'ugeoversigt':'Office — Ugeoversigt',
          'cashflow':'Office — Pengestrøm',
          'crm-kundeindsigt':'Office — Kundeindsigt',
          'crm-reaktivering':'Office — Re-aktivering',
          'crm-prospekter':'Office — Prospekter'
        };
        if (typeof HelpSystem !== 'undefined') {
          HelpSystem.setPage('office-' + viewName, helpNames[viewName] || 'Office — ' + viewName);
        }

        // Init view
        views[viewName]?.init();
      }

      // Sidebar click handlers
      document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      // Invoice badge
      async function updateInvoiceBadge() {
        try {
          const data = await fetchInvoiceQueue(false);
          const badge = document.getElementById('invoice-badge');
          if (badge && data.summary.pending_count > 0) {
            badge.textContent = data.summary.pending_count;
            badge.style.display = '';
          } else if (badge) {
            badge.style.display = 'none';
          }
        } catch (_) {}
      }
      updateInvoiceBadge();

      // Supplier inbox badge
      async function updateSiBadge() {
        try {
          const threads = await fetchOrderMailThreads({ unread_only: true });
          const badge = document.getElementById('si-badge');
          if (badge && threads.length > 0) {
            let total = 0;
            threads.forEach(t => total += (t.unread_count || 0));
            badge.textContent = total;
            badge.style.display = total > 0 ? '' : 'none';
          } else if (badge) {
            badge.style.display = 'none';
          }
        } catch (_) {}
      }
      updateSiBadge();

      // Determine initial view from URL
      const params = new URLSearchParams(window.location.search);
      const initialView = params.get('view') || 'dashboard';
      switchView(views[initialView] ? initialView : 'dashboard');

      // Open drawer from URL
      const bonIdFromUrl = params.get('bon');
      if (bonIdFromUrl) openDrawer(bonIdFromUrl);

      // ─── Popstate ────────────────────────────────────────
      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        const v = p.get('view') || 'dashboard';
        if (v !== _currentView) {
          switchView(v);
        } else if (views[v]) {
          // Samme view, men URL-params kan have ændret sig (fx customer
          // eller filter på bons-list). Force re-init så de nye params
          // tages i brug.
          if (views[v].cleanup) views[v].cleanup();
          contentEl.innerHTML = '';
          _currentView = null;
          switchView(v);
        }

        const bonId = p.get('bon');
        if (bonId) {
          drawer.load(bonId);
          drawer.show();
        } else {
          drawer.el.classList.remove('open');
          drawer.overlayEl.classList.remove('open');
          document.body.style.overflow = '';
          drawer.dirty = false;
        }
      });

      // ─── SSE (always active) ─────────────────────────────
      connectSSE('/api/sse', {
        bon_created: (data) => {
          if (typeof _blHandleBonCreated === 'function') _blHandleBonCreated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_created', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_created', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_created', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_created', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_created', data);
        },
        bon_updated: (data) => {
          if (typeof _blHandleBonUpdated === 'function') _blHandleBonUpdated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_updated', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_updated', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_updated', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_updated', data);
          if (typeof _tilbudHandleSSE === 'function') _tilbudHandleSSE('bon_updated', data);
        },
        bon_status: (data) => {
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_status', data);
          if (typeof _faktHandleSSE === 'function') _faktHandleSSE('bon_status', data);
          if (typeof _rapportHandleSSE === 'function') _rapportHandleSSE('bon_status', data);
          if (typeof _uoHandleSSE === 'function') _uoHandleSSE('bon_status', data);
        },
        crm_activity_created: (data) => {
          if (typeof _crmDashHandleSSE === 'function') _crmDashHandleSSE('crm_activity_created', data);
          if (typeof _k3HandleSSE === 'function') _k3HandleSSE('crm_activity_created', data);
          if (typeof _reakHandleSSE === 'function') _reakHandleSSE('crm_activity_created', data);
        },
        crm_stage_changed: (data) => {
          if (typeof _k3HandleSSE === 'function') _k3HandleSSE('crm_stage_changed', data);
          if (typeof _prosHandleSSE === 'function') _prosHandleSSE('crm_stage_changed', data);
        },
        rfm_computed: (data) => {
          if (typeof _kiHandleSSE === 'function') _kiHandleSSE('rfm_computed', data);
          if (typeof _reakHandleSSE === 'function') _reakHandleSSE('rfm_computed', data);
          if (typeof _prosHandleSSE === 'function') _prosHandleSSE('rfm_computed', data);
        },
        rfm_config_changed: (data) => {
          if (typeof _kiHandleSSE === 'function') _kiHandleSSE('rfm_config_changed', data);
        },
        mail_unmatched: (data) => {
          if (typeof _inbHandleSSE === 'function') _inbHandleSSE('mail_unmatched', data);
        },
        // quote_created / quote_updated fjernet i Patch I (maj 2026).
        // Backend sender bon_*-events også for tilbud (jf. Patch F). _tilbudHandleSSE
        // er nu wired ind i bon_created/bon_updated-handlerne ovenfor.
        po_mail_received: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_received', data);
        },
        po_mail_sent: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('po_mail_sent', data);
        },
        supplier_mail_received: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_received', data);
        },
        supplier_mail_sent: (data) => {
          if (typeof _siHandleSSE === 'function') _siHandleSSE('supplier_mail_sent', data);
        },
      });
    })();
  </script>
  <script src="/shared/help-system.js"></script>
</body>
</html>
