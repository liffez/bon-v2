<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bon v2 — Office</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="../shared/kunde_soeg.css">
  <link rel="stylesheet" href="../shared/bon_opret_modal.css">
  <link rel="stylesheet" href="../shared/bon_drawer.css">
  <link rel="stylesheet" href="../shared/vare_picker.css">
  <link rel="stylesheet" href="../shared/dashboard_chart.css">
  <!-- Chart.js removed — custom canvas chart in shared/dashboard_chart.js -->
  <style>
    /* ── Shell layout ───────────────────────────────────────── */
    .office-shell {
      display: flex;
      height: 100vh;
      flex-direction: column;
    }
    .office-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-m, 16px) var(--space-l, 24px);
      border-bottom: 1px solid var(--color-border, #d7d1ca);
      background: var(--color-surface, #fff);
      flex-shrink: 0;
    }
    .office-topbar h1 {
      font-size: var(--font-size-l, 18px);
      margin: 0;
      font-weight: 700;
    }
    .office-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────── */
    .office-sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #3d2a0f;
      display: flex;
      flex-direction: column;
      padding: 0;
      color: rgba(255,255,255,0.75);
    }
    .sidebar-brand {
      padding: 14px 16px 10px;
      font-size: 14px;
      font-weight: 900;
      color: rgba(255,255,255,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 8px 8px;
      overflow-y: auto;
    }
    .sidebar-group-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: rgba(255,255,255,0.3);
      padding: 12px 12px 4px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      width: 100%;
      text-align: left;
      transition: background 0.12s;
    }
    .sidebar-link:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.95);
    }
    .sidebar-link.active {
      background: rgba(255,255,255,0.12);
      color: #f1e6b2;
      font-weight: 700;
    }
    .sidebar-link.disabled {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    .sidebar-link .sidebar-icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
    }
    .sidebar-bottom {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }
    .sidebar-user-av {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.8);
    }
    .sidebar-user-name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); }
    .sidebar-user-role { font-size: 9px; color: rgba(255,255,255,0.4); }

    /* ── Content ────────────────────────────────────────────── */
    #office-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-l, 24px);
    }

    /* ── Bons List ─────────────────────────────────────────── */

    .bl-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-search-wrap { flex: 1; min-width: 200px; }
    .bl-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--color-surface, #fff);
    }
    .bl-search:focus { outline: 2px solid var(--brand-primary, #8e631f); outline-offset: -1px; }
    .bl-toolbar-right { display: flex; align-items: center; gap: 8px; }
    .bl-ny-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-ny-btn:hover { filter: brightness(1.1); }

    /* Column chooser */
    .bl-col-chooser { position: relative; }
    .bl-col-btn {
      padding: 8px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .bl-col-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-col-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--color-surface, #fff);
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 8px;
      z-index: 100;
      min-width: 180px;
    }
    .bl-col-dropdown.open { display: block; }
    .bl-col-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
    }
    .bl-col-item:hover { background: var(--color-background, #f5f4f2); }

    /* Filters */
    .bl-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .bl-filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 20px;
      background: var(--color-surface, #fff);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .bl-filter-btn:hover { background: var(--color-background, #f5f4f2); }
    .bl-filter-btn.active {
      background: var(--brand-primary, #8e631f);
      color: #fff;
      border-color: var(--brand-primary, #8e631f);
    }
    .bl-date-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }
    .bl-date-wrap label { color: var(--color-text-dim, #888); white-space: nowrap; }
    .bl-date-input {
      padding: 5px 8px;
      border: 1px solid var(--color-border, #d7d1ca);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    /* Summary */
    .bl-summary {
      padding: 10px 16px;
      background: var(--brand-primary-light, #f1e6b2);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-primary, #8e631f);
      margin-bottom: 12px;
    }

    /* Table */
    .bl-table-wrap { overflow-x: auto; }
    .bl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .bl-th {
      padding: 8px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--color-text-dim, #888);
      border-bottom: 2px solid var(--color-border, #d7d1ca);
      white-space: nowrap;
      user-select: none;
    }
    .bl-th.bl-sortable { cursor: pointer; }
    .bl-th.bl-sortable:hover { color: var(--brand-primary, #8e631f); }
    .bl-th.bl-sorted::after {
      content: ' \25B2';
      font-size: 10px;
    }
    .bl-th.bl-sorted.desc::after {
      content: ' \25BC';
    }

    /* Rows */
    .bl-row { cursor: pointer; }
    .bl-row-main td {
      padding: 10px 12px 2px;
      border-top: 1px solid var(--color-border, #d7d1ca);
    }
    .bl-row-sub td {
      padding: 0 12px 8px;
      font-size: 13px;
    }
    .bl-row-main:first-child td { border-top: none; }
    .bl-row:hover td { background: var(--color-background, #f5f4f2); }
    .bl-row-main:hover + .bl-row-sub td { background: var(--color-background, #f5f4f2); }

    /* Production */
    .bl-production { border-left: 3px solid #3a7bd5; }
    .bl-prod-icon { font-size: 12px; }

    /* Cells */
    .bl-td-bon { font-weight: 700; white-space: nowrap; vertical-align: top; }
    .bl-bon-number { font-variant-numeric: tabular-nums; }
    .bl-td-date { white-space: nowrap; }
    .bl-td-date.bl-today { font-weight: 600; color: var(--brand-primary, #8e631f); }
    .bl-td-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .bl-td-status { vertical-align: top; white-space: nowrap; }
    .bl-td-num { text-align: right; font-variant-numeric: tabular-nums; }
    .bl-td-dim { color: var(--color-text-dim, #888); }
    .bl-td-opt { white-space: nowrap; }

    /* Status badge */
    .bl-status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    /* Mail */
    .bl-mail-icon {
      color: #d4781a;
      font-size: 13px;
      margin-left: 4px;
    }
    .bl-mail-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #d4781a;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    /* Staff badge */
    .bl-staff-badge {
      display: inline-block;
      margin-left: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      background: var(--brand-primary, #8e631f);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: default;
      vertical-align: middle;
    }

    /* Empty state */
    .bl-empty {
      text-align: center;
      padding: 40px 12px;
      color: var(--color-text-dim, #888);
      font-size: 15px;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .office-sidebar { display: none; }
      #office-content { padding: var(--space-s, 8px); }
      .bl-toolbar { flex-direction: column; }
      .bl-search-wrap { width: 100%; }
      .bl-filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
      .bl-row-sub { display: none; }
      .bl-td-bon { font-size: 13px; }
      .bl-th, .bl-row-main td { padding: 6px 8px 2px; }
    }
  </style>
</head>
<body class="zone-office">
  <div class="office-shell">
    <div class="office-topbar">
      <h1 id="office-topbar-title">Bon v2 — Office</h1>
      <div id="office-topbar-right" style="display:flex;align-items:center;gap:12px;font-size:13px;"></div>
    </div>
    <div class="office-body">
      <nav class="office-sidebar">
        <div class="sidebar-brand">🍞 Ristet Rug</div>
        <div class="sidebar-nav">
          <div class="sidebar-group-label">Overblik</div>
          <button class="sidebar-link" data-view="dashboard">
            <span class="sidebar-icon">📊</span> Dashboard
          </button>

          <div class="sidebar-group-label">Ordrer</div>
          <button class="sidebar-link" data-view="bons">
            <span class="sidebar-icon">📋</span> Bons
          </button>
          <button class="sidebar-link" data-view="calendar">
            <span class="sidebar-icon">📅</span> Kalender
          </button>

          <div class="sidebar-group-label">CRM</div>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">🔀</span> Pipeline
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">📝</span> Tilbud
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">👤</span> Kunder
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">📞</span> Serviceopkald
          </button>

          <div class="sidebar-group-label">Drift</div>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">🚛</span> Logistik
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">🍽️</span> Køkken
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">🛒</span> Indkøb
          </button>

          <div class="sidebar-group-label">Økonomi</div>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">💰</span> Fakturering
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">📈</span> Rapporter
          </button>

          <div class="sidebar-group-label">Team</div>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">🕐</span> Vagtplan
          </button>
          <button class="sidebar-link disabled">
            <span class="sidebar-icon">📝</span> Whiteboard
          </button>
        </div>
        <div class="sidebar-bottom">
          <a href="/settings/index.html" class="sidebar-link">
            <span class="sidebar-icon">⚙️</span> Settings
          </a>
          <button class="sidebar-link" id="sidebar-logout">
            <span class="sidebar-icon">↩</span> Log ud
          </button>
          <div class="sidebar-user" id="sidebar-user"></div>
        </div>
      </nav>
      <main id="office-content">
        <!-- View mounts here -->
      </main>
    </div>
  </div>

  <!-- Scripts: globals first, then components -->
  <script src="/shared/utils.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../BonConfig.js"></script>
  <script src="../BonConfigBar.js"></script>
  <script src="../shared/kunde_soeg.js"></script>
  <script src="../shared/bon_opret_modal.js"></script>
  <script src="../shared/vare_picker.js"></script>
  <script src="../shared/bon_drawer.js"></script>
  <script src="../shared/dashboard_chart.js"></script>
  <script src="views/bons-list.js"></script>
  <script src="views/dashboard.js"></script>

  <script>
    (async () => {
      const currentUser = await checkAuth();
      if (!currentUser) return;

      // ─── Sidebar user ──────────────────────────────────────
      const userEl = document.getElementById('sidebar-user');
      if (userEl && currentUser) {
        const name = currentUser.name || currentUser.email || '';
        const init = name.charAt(0).toUpperCase();
        const role = currentUser.role === 'admin' ? 'Administrator' : currentUser.role === 'kitchen' ? 'Køkken' : currentUser.role || '';
        userEl.innerHTML = `
          <div class="sidebar-user-av">${init}</div>
          <div><div class="sidebar-user-name">${name}</div><div class="sidebar-user-role">${role}</div></div>
        `;
      }

      // ─── Logout ──────────────────────────────────────────
      document.getElementById('sidebar-logout').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/shared/login.html';
      });

      // ─── Drawer (shared across views) ────────────────────
      const drawer = new BonDrawer();

      function openDrawer(bonId) {
        const url = new URL(window.location);
        url.searchParams.set('bon', bonId);
        history.pushState({}, '', url);
        drawer.load(bonId);
        drawer.show();
      }

      // Override drawer hide to sync URL
      const origHide = drawer.hide.bind(drawer);
      drawer.hide = function() {
        origHide();
        const url = new URL(window.location);
        if (url.searchParams.has('bon')) {
          url.searchParams.delete('bon');
          history.pushState({}, '', url);
        }
      };

      // ─── Modal ───────────────────────────────────────────
      const modal = new BonOpretModal({
        onCreated: (bonId) => openDrawer(bonId)
      });

      // ─── View switching ──────────────────────────────────
      const contentEl = document.getElementById('office-content');
      let _currentView = null;

      const views = {
        dashboard: {
          init: () => initOfficeDashboard(contentEl, { openDrawer }),
          cleanup: () => { if (typeof cleanupOfficeDashboard === 'function') cleanupOfficeDashboard(); },
        },
        bons: {
          init: () => initBonsList(contentEl, { openDrawer, openNewBon: () => modal.open() }),
          cleanup: () => {},
        },
        calendar: {
          init: () => {
            contentEl.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--color-text-dim,#888);font-size:15px;">Kalender kommer snart...</div>';
          },
          cleanup: () => {},
        },
      };

      function switchView(viewName) {
        if (_currentView === viewName) return;

        // Cleanup previous
        if (_currentView && views[_currentView]?.cleanup) {
          views[_currentView].cleanup();
        }

        // Clear content
        contentEl.innerHTML = '';
        _currentView = viewName;

        // Update sidebar active state
        document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.view === viewName);
        });

        // Update URL
        const url = new URL(window.location);
        url.searchParams.set('view', viewName);
        if (!url.searchParams.has('bon')) {
          history.replaceState({}, '', url);
        }

        // Init view
        views[viewName]?.init();
      }

      // Sidebar click handlers
      document.querySelectorAll('.sidebar-link[data-view]').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
      });

      // Determine initial view from URL
      const params = new URLSearchParams(window.location.search);
      const initialView = params.get('view') || 'dashboard';
      switchView(views[initialView] ? initialView : 'dashboard');

      // Open drawer from URL
      const bonIdFromUrl = params.get('bon');
      if (bonIdFromUrl) openDrawer(bonIdFromUrl);

      // ─── Popstate ────────────────────────────────────────
      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        const v = p.get('view') || 'dashboard';
        if (v !== _currentView) switchView(v);

        const bonId = p.get('bon');
        if (bonId) {
          drawer.load(bonId);
          drawer.show();
        } else {
          drawer.el.classList.remove('open');
          drawer.overlayEl.classList.remove('open');
          document.body.style.overflow = '';
          drawer.dirty = false;
        }
      });

      // ─── SSE (always active) ─────────────────────────────
      connectSSE('/api/sse', {
        bon_created: (data) => {
          if (typeof _blHandleBonCreated === 'function') _blHandleBonCreated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_created', data);
        },
        bon_updated: (data) => {
          if (typeof _blHandleBonUpdated === 'function') _blHandleBonUpdated(data);
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_updated', data);
        },
        bon_status: (data) => {
          if (typeof _dashHandleSSE === 'function') _dashHandleSSE('bon_status', data);
        },
      });
    })();
  </script>
</body>
</html>
