<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind — Bon v2</title>
    <link rel="stylesheet" href="/shared/tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--color-background);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: var(--space-xl) var(--space-l);
            width: 100%;
            max-width: 400px;
            margin: var(--space-m);
            text-align: center;
        }

        .login-card img {
            width: 180px;
            margin-bottom: var(--space-m);
        }

        .login-card .subtitle {
            color: var(--color-text-dim);
            font-size: var(--font-size-m);
            margin-bottom: var(--space-l);
        }

        .login-card input {
            display: block;
            width: 100%;
            padding: 12px 16px;
            font-size: var(--font-size-l);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-body);
            outline: none;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            border-color: var(--brand-primary);
        }

        #password-field {
            margin-top: var(--space-s);
            display: none;
            transition: opacity 0.2s;
        }

        #password-field.visible {
            display: block;
        }

        .login-card button {
            display: block;
            width: 100%;
            margin-top: var(--space-m);
            padding: 12px;
            font-size: var(--font-size-l);
            font-weight: 600;
            color: #fff;
            background: var(--brand-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            transition: opacity 0.2s;
        }

        .login-card button:hover { opacity: 0.9; }
        .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── PIN-pad (kun på kiosken) ──
           Raspberry Pi OS har intet skærmtastatur, så en fastmonteret
           touchskærm kunne kun logge ind med et fysisk tastatur. */
        .pin-pad {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: var(--space-m);
        }
        body.kiosk-login .pin-pad { display: grid; }
        body.kiosk-login #submit-btn { display: none; }
        body.kiosk-login .login-card { max-width: 440px; }

        .login-card .pin-pad button {
            margin-top: 0;
            min-height: 76px;
            font-size: 30px;
            font-weight: 600;
            color: var(--color-text);
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .login-card .pin-pad button:active { background: var(--color-border); }
        .login-card .pin-pad .pad-ok {
            color: #fff;
            background: var(--brand-primary);
            border-color: var(--brand-primary);
            font-size: 22px;
        }
        .login-card .pin-pad .pad-back { font-size: 26px; }

        /* Maskér PIN'en uden type=password: et password-felt får Chromium
           til at tilbyde "Gem adgangskode?" oven på kiosken, og der står
           ingen til at trykke den væk. */
        body.kiosk-login #identity {
            -webkit-text-security: disc;
            letter-spacing: 0.3em;
            text-align: center;
        }

        .error-msg {
            margin-top: var(--space-s);
            color: var(--color-red);
            font-size: var(--font-size-s);
            min-height: 1.4em;
        }

        .mobile-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--brand-primary);
            color: #fff; text-align: center;
            padding: 12px 16px; font-size: 14px;
            display: none; z-index: 100;
        }
        .mobile-banner a {
            display: inline-block;
            background: #fff; color: var(--brand-primary);
            padding: 6px 16px; border-radius: 6px;
            text-decoration: none; font-weight: 600;
            margin-left: 8px;
        }
        .mobile-banner .dismiss {
            background: none; color: rgba(255,255,255,.7);
            border: none; font-size: 13px; cursor: pointer;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/assets/logo.svg" alt="Ristet Rug">
        <div class="subtitle">Bon v2</div>

        <form id="login-form" autocomplete="on">
            <input type="text" id="identity" placeholder="PIN eller email" autocomplete="username" autofocus>
            <input type="password" id="password-field" placeholder="Password" autocomplete="current-password">
            <div class="pin-pad" id="pin-pad" aria-label="PIN-tastatur">
                <button type="button" data-key="1">1</button>
                <button type="button" data-key="2">2</button>
                <button type="button" data-key="3">3</button>
                <button type="button" data-key="4">4</button>
                <button type="button" data-key="5">5</button>
                <button type="button" data-key="6">6</button>
                <button type="button" data-key="7">7</button>
                <button type="button" data-key="8">8</button>
                <button type="button" data-key="9">9</button>
                <button type="button" data-key="back" class="pad-back" aria-label="Slet">⌫</button>
                <button type="button" data-key="0">0</button>
                <button type="button" data-key="ok" class="pad-ok">Log ind</button>
            </div>
            <button type="submit" id="submit-btn">Log ind</button>
            <div class="error-msg" id="error-msg"></div>
        </form>
    </div>

    <script>
        function getDefaultZone(role) {
            if (role === 'admin' || role === 'office') return '/office/';
            if (role === 'kitchen_personal') return '/mobile/';
            return '/kitchen/';
        }

        // Hvor skal vi hen efter login? `next` sendes af checkAuth (kiosken) og af
        // bud-popoutet (routes/delivery_views.js) som en sti. Login-gaten foran
        // whiteboard/sop/grocy (deploy/hetzner/nginx/snippets/bon-auth.conf) sender
        // en HEL adresse på et søster-subdomæne — uden den blev man efter login
        // stående i Bon i stedet for at komme tilbage til Whiteboard.
        // "//evil.dk" og "/\\evil.dk" er protokol-relative og ville sende brugeren væk;
        // en fuld adresse skal være https og ligge under samme domæne som os.
        function safeNextPath() {
            const next = new URLSearchParams(location.search).get('next');
            if (!next) return null;
            if (next[0] === '/') {
                return (next[1] === '/' || next[1] === '\\') ? null : next;
            }
            let url;
            try { url = new URL(next); } catch (e) { return null; }
            if (url.protocol !== 'https:') return null;
            const here = location.hostname;
            const parent = here.split('.').slice(-2).join('.');
            const sameSite = url.hostname === here
                || (here.includes('.') && url.hostname.endsWith('.' + parent));
            return sameSite ? url.href : null;
        }

        function afterLogin(role) {
            window.location.href = safeNextPath() || getDefaultZone(role);
        }

        // Kiosken kommer hertil med ?kiosk (direkte), med kiosk-URL'en i `next`, eller
        // fra en browser der har husket at den er en kiosk (shared/utils.js).
        // ?kiosk=off glemmer det igen — fx på en office-pc hvor nogen har testet.
        const KIOSK_DEVICE_KEY = 'bon_kiosk_device';
        const kioskMode = (() => {
            const params = new URLSearchParams(location.search);
            try {
                if (params.get('kiosk') === 'off') { localStorage.removeItem(KIOSK_DEVICE_KEY); return false; }
                if (localStorage.getItem(KIOSK_DEVICE_KEY)) return true;
            } catch (e) { /* spærret localStorage — falder tilbage på URL'en */ }
            if (params.has('kiosk')) return true;
            const next = safeNextPath();
            return !!next && new URLSearchParams((next.split('?')[1] || '').split('#')[0]).has('kiosk');
        })();
        if (kioskMode) document.body.classList.add('kiosk-login');

        const identityEl = document.getElementById('identity');
        const passwordEl = document.getElementById('password-field');
        const errorEl    = document.getElementById('error-msg');
        const form       = document.getElementById('login-form');

        identityEl.addEventListener('input', () => {
            const val = identityEl.value.trim();
            const isEmail = val.includes('@');
            if (isEmail) {
                passwordEl.classList.add('visible');
            } else {
                passwordEl.classList.remove('visible');
                passwordEl.value = '';
            }
            errorEl.textContent = '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';

            const val = identityEl.value.trim();
            if (!val) return;

            const isPin = /^\d+$/.test(val);
            const btn = form.querySelector('button');
            btn.disabled = true;

            try {
                let res;
                if (isPin) {
                    res = await fetch('/api/auth/pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: val })
                    });
                } else {
                    const pw = passwordEl.value;
                    if (!pw) {
                        passwordEl.classList.add('visible');
                        passwordEl.focus();
                        btn.disabled = false;
                        return;
                    }
                    res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: val, password: pw })
                    });
                }

                if (!res.ok) {
                    const data = await res.json();
                    errorEl.textContent = data.error || 'Login fejlede';
                    btn.disabled = false;
                    return;
                }

                const user = await res.json();
                afterLogin(user.role);
            } catch (err) {
                errorEl.textContent = 'Netværksfejl — prøv igen';
                btn.disabled = false;
            }
        });

        // Tjek om allerede logget ind
        (async () => {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const user = await res.json();
                    afterLogin(user.role);
                }
            } catch {}
        })();

        // PIN-pad: skriver i det samme felt som et fysisk tastatur, så begge virker.
        if (kioskMode) {
            identityEl.placeholder = 'PIN';
            identityEl.setAttribute('inputmode', 'none');
            identityEl.setAttribute('autocomplete', 'off');
            document.getElementById('pin-pad').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-key]');
                if (!btn) return;
                const key = btn.dataset.key;
                if (key === 'ok') { form.requestSubmit(); return; }
                if (key === 'back') identityEl.value = identityEl.value.slice(0, -1);
                else identityEl.value += key;
                identityEl.dispatchEvent(new Event('input'));
            });
        }

        // Mobil auto-redirect — touch + smal skærm → send direkte til mobil-login
        // ?desktop=1 i URL eller localStorage 'preferDesktop' forhindrer redirect
        if (!kioskMode && window.innerWidth < 640 && 'ontouchstart' in window
            && !localStorage.getItem('preferDesktop')
            && !new URLSearchParams(location.search).has('desktop')) {
            window.location.href = '/mobile/login.html';
        }
    </script>
</body>
</html>
