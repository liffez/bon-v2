<svg viewBox="0 0 1160 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Indkøb i køkkenet — fra indkøbsliste til lager</title>
  <desc id="desc">Oversigt: en vare lægges på indkøbslisten fra mange steder, justeres, bestilles hos leverandøren, modtages i varemodtagelsen — og lægges så automatisk på det elektroniske lager og fjernes fra listen. Til sidst sættes den på det fysiske lager.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0a493"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="620" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="48" font-size="25" font-weight="700" fill="#8e631f">Indkøb i køkkenet — fra indkøbsliste til lager</text>
  <text x="41" y="78" font-size="15" fill="#7a6c58">Den korte version:  læg på listen  →  bestil det rigtige  →  modtag  →  automatisk på lager</text>

  <!-- ===== STEP 1: Læg på listen (panel med mange indgange) ===== -->
  <rect x="40" y="108" width="330" height="430" rx="14" fill="#f7edcb" stroke="#e3d08f" stroke-width="1.5"/>
  <circle cx="70" cy="142" r="15" fill="#8e631f"/>
  <text x="70" y="148" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="96" y="140" font-size="19" font-weight="700" fill="#5a3f14">Læg på listen</text>
  <text x="96" y="160" font-size="12.5" fill="#8a7a5f">Mange steder — vælg den der passer</text>

  <!-- 6 entry points -->
  <g font-size="14.5" fill="#4a3b28">
    <text x="66" y="205">📉  <tspan font-weight="600">Manglende</tspan> <tspan fill="#8a7a5f" font-size="12.5">(under minimum)</tspan></text>
    <line x1="66" y1="222" x2="344" y2="222" stroke="#e6d6a6" stroke-width="1"/>
    <text x="66" y="252">⏰  <tspan font-weight="600">Udløbende</tspan> <tspan fill="#8a7a5f" font-size="12.5">(udløber snart)</tspan></text>
    <line x1="66" y1="269" x2="344" y2="269" stroke="#e6d6a6" stroke-width="1"/>
    <text x="66" y="299">➕  <tspan font-weight="600">Tilføj vare</tspan> <tspan fill="#8a7a5f" font-size="12.5">(søg i Grocy)</tspan></text>
    <line x1="66" y1="316" x2="344" y2="316" stroke="#e6d6a6" stroke-width="1"/>
    <text x="66" y="346">🔗  <tspan font-weight="600">Opret / kobl</tspan> <tspan fill="#8a7a5f" font-size="12.5">ny vare</tspan></text>
    <line x1="66" y1="363" x2="344" y2="363" stroke="#e6d6a6" stroke-width="1"/>
    <text x="66" y="393">🛒  <tspan font-weight="600">Fra Råvarer</tspan> <tspan fill="#8a7a5f" font-size="12.5">på en bon</tspan></text>
    <line x1="66" y1="410" x2="344" y2="410" stroke="#e6d6a6" stroke-width="1"/>
    <text x="66" y="440">📊  <tspan font-weight="600">Fra Lager</tspan> <tspan fill="#8a7a5f" font-size="12.5">/ optælling</tspan></text>
  </g>
  <text x="66" y="500" font-size="13" fill="#8e631f" font-style="italic">↳ alt samles ét sted: indkøbslisten</text>

  <!-- arrow panel -> step 2 -->
  <line x1="372" y1="300" x2="406" y2="300" stroke="#b0a493" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== STEPS 2–5 (vandret rejse) ===== -->
  <!-- Step 2 -->
  <g>
    <rect x="410" y="230" width="150" height="150" rx="12" fill="#ffffff" stroke="#d7d1ca" stroke-width="1.5"/>
    <circle cx="430" cy="250" r="13" fill="#8e631f"/><text x="430" y="255" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="485" y="288" font-size="27" text-anchor="middle">⚙️</text>
    <text x="485" y="322" font-size="15.5" font-weight="700" fill="#402d15" text-anchor="middle">Justér &amp; gør klar</text>
    <text x="485" y="344" font-size="11.5" fill="#7a6c58" text-anchor="middle">Antal · stregkode · kobl</text>
  </g>
  <line x1="560" y1="305" x2="592" y2="305" stroke="#b0a493" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <rect x="596" y="230" width="150" height="150" rx="12" fill="#ffffff" stroke="#d7d1ca" stroke-width="1.5"/>
    <circle cx="616" cy="250" r="13" fill="#8e631f"/><text x="616" y="255" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="671" y="288" font-size="27" text-anchor="middle">🛒</text>
    <text x="671" y="322" font-size="15.5" font-weight="700" fill="#402d15" text-anchor="middle">Bestil</text>
    <text x="671" y="344" font-size="11" fill="#7a6c58" text-anchor="middle">Hørkram · Email · RR</text>
  </g>
  <line x1="746" y1="305" x2="778" y2="305" stroke="#b0a493" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="782" y="230" width="150" height="150" rx="12" fill="#ffffff" stroke="#d7d1ca" stroke-width="1.5"/>
    <circle cx="802" cy="250" r="13" fill="#8e631f"/><text x="802" y="255" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="857" y="288" font-size="27" text-anchor="middle">📦</text>
    <text x="857" y="322" font-size="15.5" font-weight="700" fill="#402d15" text-anchor="middle">Modtag</text>
    <text x="857" y="344" font-size="11.5" fill="#7a6c58" text-anchor="middle">Temp · foto · antal</text>
  </g>
  <line x1="932" y1="305" x2="964" y2="305" stroke="#2f7d4f" stroke-width="3" marker-end="url(#arrowG)"/>

  <!-- Step 5 -->
  <g>
    <rect x="968" y="230" width="150" height="150" rx="12" fill="#ffffff" stroke="#d7d1ca" stroke-width="1.5"/>
    <circle cx="988" cy="250" r="13" fill="#8e631f"/><text x="988" y="255" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="1043" y="288" font-size="27" text-anchor="middle">🥫</text>
    <text x="1043" y="322" font-size="15.5" font-weight="700" fill="#402d15" text-anchor="middle">På fysisk lager</text>
    <text x="1043" y="344" font-size="11.5" fill="#7a6c58" text-anchor="middle">Sæt på plads</text>
  </g>

  <!-- ===== Automatisk-callout (grøn) ===== -->
  <line x1="949" y1="430" x2="949" y2="384" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <rect x="596" y="430" width="522" height="128" rx="12" fill="#e8f3ec" stroke="#b8dcc6" stroke-width="1.5"/>
  <text x="620" y="462" font-size="15.5" font-weight="700" fill="#2f7d4f">✓ Sker automatisk ved modtagelsen</text>
  <text x="620" y="489" font-size="13.5" fill="#33402f">OK-varer lægges på det <tspan font-weight="700">elektroniske lager (Grocy)</tspan> og fjernes fra listen.</text>
  <text x="620" y="512" font-size="12.5" fill="#5c6b56">Delvis levering → antal reduceres  ·  Mangler → bliver på listen til næste gang.</text>
  <text x="620" y="537" font-size="12.5" fill="#5c6b56">Bagefter mangler kun ét: at sætte varerne på det fysiske lager.</text>

  <!-- footer -->
  <text x="40" y="600" font-size="12" fill="#a89a83">Bon v2 · Indkøb — køkken  ·  oversigt (1/5)</text>
</svg>
